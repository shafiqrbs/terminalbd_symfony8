_www_domain_app_vowsbd_com:
  resource: '@FrontendBundle/Resources/config/routing/ecommercesubdomain.yml'
  host: '{domain_name}'
  name_prefix: vowsbd_
  defaults: { subdomain: vowsbd, domain_name: www.vowsbd.com }
  requirements: { domain_name: www.vowsbd.com|vowsbd.com }

_www_domain_app_bhaws_org:
  resource: '@FrontendBundle/Resources/config/routing/ecommercesubdomain.yml'
  host: '{domain_name}'
  name_prefix: bhaws_
  defaults: { subdomain: bhaws, domain_name: www.bhaws.org }
  requirements: { domain_name: www.bhaws.org|bhaws.org }

_www_domain_app_standardengineersltd_com:
  resource: '@FrontendBundle/Resources/config/routing/ecommercesubdomain.yml'
  host: '{domain_name}'
  name_prefix: standardengineersltd_
  defaults: { subdomain: standardengineersltd, domain_name: www.standardengineersltd.com }
  requirements: { domain_name: www.standardengineersltd.com|standardengineersltd.com }