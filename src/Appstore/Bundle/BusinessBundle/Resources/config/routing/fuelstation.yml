            expose: true

business_fuelstation_item_approve:
    path:     /{id}/item-approve
    defaults: { _controller: "BusinessBundle:InvoiceFuelPump:itemApprove" }
    options:
            expose: true

business_fuelstation_delete:
    path:     /{id}/delete
    defaults: { _controller: "BusinessBundle:InvoiceFuelPump:delete" }


business_fuelstation_item_update:
    path:     /{id}/item-batch-update
    defaults: { _controller: "BusinessBundle:InvoiceFuelPump:batchItemUpdate" }
