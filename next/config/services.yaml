# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# Entry point for this app's own services.
#
# The App\ auto-registration lives in services_legacy.yaml, which is generated
# by migration/bin/gen-service-excludes.php. It carries the exclusion list for
# the 214 ported form types whose constructors take runtime values rather than
# services. Put hand-written service definitions here, not there.

imports:
    - { resource: services_legacy.yaml }
    - { resource: services_ported.yaml }

parameters:
    # Was fos_user.resetting.token_ttl; ResettingController still reads it.
    fos_user.resetting.token_ttl: '%env(int:RESETTING_TOKEN_TTL)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    # Transitional: several ported services take the whole container, a Symfony 2
    # habit that Symfony 8 no longer autowires. Aliasing keeps them working while
    # the migration proceeds; each should be refactored to explicit dependencies
    # and this alias removed once none remain.
    Symfony\Component\DependencyInjection\ContainerInterface: '@service_container'
    Psr\Container\ContainerInterface: '@service_container'

    # Replaces fos_user.mailer. The from address was a FOSUserBundle default,
    # never set in app/config/bundles/fos_user.yml, so it stays configurable.
    App\User\Mailer\ResettingMailer:
        arguments:
            $fromEmail: '%env(MAILER_FROM)%'

    # fos_user.resetting.token_ttl was a bundle parameter; the controller still
    # honours it when deciding whether a reset was already requested.
    App\User\Controller\ResettingController:
        autowire: true
        autoconfigure: true
        arguments:
            $tokenTtl: '%fos_user.resetting.token_ttl%'
        tags: ['controller.service_arguments']

    # gregwar/image-bundle has no Symfony 8 release (its DI extension is a
    # fatal on boot); these two reproduce the image.handling service and the
    # image() Twig function over the gregwar/image library, with the bundle's
    # own defaults.
    App\Tool\Image\ImageHandling:
        arguments:
            $publicDir: '%kernel.project_dir%/public'

    App\Tool\Twig\ImageExtension:
        arguments:
            $publicDir: '%kernel.project_dir%/public'

    # The shared session store. PdoSessionHandler takes the same database URL
    # Doctrine uses; `sessions` is an additive table, created by
    # migration/bin/create-session-table.php, which the legacy application
    # points at too.
    session.handler.shared:
        class: Symfony\Component\HttpFoundation\Session\Storage\Handler\PdoSessionHandler
        arguments:
            - '%env(resolve:DATABASE_URL)%'
            - { db_table: 'sessions', db_id_col: 'sess_id', db_data_col: 'sess_data', db_lifetime_col: 'sess_lifetime', db_time_col: 'sess_time', lock_mode: 1 }
