# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# Entry point for this app's own services.
#
# The App\ auto-registration lives in services_legacy.yaml, which is generated
# by migration/bin/gen-service-excludes.php. It carries the exclusion list for
# the 214 ported form types whose constructors take runtime values rather than
# services. Put hand-written service definitions here, not there.

imports:
    - { resource: services_legacy.yaml }

parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    # Transitional: several ported services take the whole container, a Symfony 2
    # habit that Symfony 8 no longer autowires. Aliasing keeps them working while
    # the migration proceeds; each should be refactored to explicit dependencies
    # and this alias removed once none remain.
    Symfony\Component\DependencyInjection\ContainerInterface: '@service_container'
    Psr\Container\ContainerInterface: '@service_container'
