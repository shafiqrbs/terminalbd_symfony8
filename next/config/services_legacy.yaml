# GENERATED by migration/bin/gen-service-excludes.php - do not edit by hand.
#
# 0 form types take runtime values (entities, repositories, the
# tenant's GlobalOption) as constructor arguments. Autowiring cannot build them,
# so they are excluded from service registration here. port-form-types.php moves
# such constructors into configureOptions(), which is why this list should stay
# empty - a non-empty list means a port reintroduced the Symfony 2 pattern.
#
# As each form type's dependencies move into configureOptions(), remove its
# line here so it becomes an ordinary autowired service again.

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
            # entity graph - data objects, never services
            - '../src/*/Entity/'
            # form types with non-autowirable constructors (see header)
