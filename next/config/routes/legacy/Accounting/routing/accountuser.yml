account_user:
    path:     /
    defaults: { _controller: 'App\Accounting\Controller\UserController::indexAction' }


account_user_show:
    path:     /{id}/show
    defaults: { _controller: 'App\Accounting\Controller\UserController::showAction' }

account_user_new:
    path:     /new
    defaults: { _controller: 'App\Accounting\Controller\UserController::newAction' }

account_user_create:
    path:     /create
    defaults: { _controller: 'App\Accounting\Controller\UserController::createAction' }
    methods:  POST

account_user_edit:
    path:     /{id}/edit
    defaults: { _controller: 'App\Accounting\Controller\UserController::editAction' }

account_user_user_mode:
    path:     /{id}/change-user-mode
    defaults: { _controller: 'App\Accounting\Controller\UserController::changeUserModeAction' }

account_user_update:
    path:     /{id}/update
    defaults: { _controller: 'App\Accounting\Controller\UserController::updateAction' }
    methods:  [POST, PUT]

account_user_delete:
    path:     /{id}/delete
    defaults: { _controller: 'App\Accounting\Controller\UserController::deleteAction' }
    options:
           expose: true

