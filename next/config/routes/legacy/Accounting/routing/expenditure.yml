account_expenditure:
    path:     /
    defaults: { _controller: 'App\Accounting\Controller\ExpenditureController::indexAction' }


account_expenditure_new:
    path:     /new
    defaults: { _controller: 'App\Accounting\Controller\ExpenditureController::newAction' }

account_expenditure_create:
    path:     /create
    defaults: { _controller: 'App\Accounting\Controller\ExpenditureController::createAction' }
    methods:  POST


account_expenditure_approve:
    path:     /{id}/payment-approve
    defaults: { _controller: 'App\Accounting\Controller\ExpenditureController::approveAction' }
    options:
           expose: true

account_expenditure_inline:
    path:     /inline-update
    defaults: { _controller: 'App\Accounting\Controller\ExpenditureController::inlineUpdateAction' }


account_expenditure_delete:
    path:     /{id}/delete
    defaults: { _controller: 'App\Accounting\Controller\ExpenditureController::deleteAction' }
    options:
           expose: true

account_expenditure_reverse:
    path:     /{id}/reverse
    defaults: { _controller: 'App\Accounting\Controller\ExpenditureController::expenditureReverseAction' }

account_expenditure_android:
    path:     /android
    defaults: { _controller: 'App\Accounting\Controller\ExpenditureController::androidExpenseAction' }

account_expenditure_expense_import:
    path:      /device-expense-process/{android}
    defaults: { _controller: 'App\Accounting\Controller\ExpenditureController::insertAndroidExpenseAction' }

