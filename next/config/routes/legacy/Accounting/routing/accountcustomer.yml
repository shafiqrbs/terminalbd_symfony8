account_customer:
    path:     /
    defaults: { _controller: 'App\Accounting\Controller\CustomerController::indexAction' }

account_customer_restore:
    path:     /customer-restore
    defaults: { _controller: 'App\Accounting\Controller\CustomerController::restoreCustomerAction' }

account_customer_show:
    path:     /{id}/show
    defaults: { _controller: 'App\Accounting\Controller\CustomerController::showAction' }

account_customer_new:
    path:     /new
    defaults: { _controller: 'App\Accounting\Controller\CustomerController::newAction' }

account_customer_create:
    path:     /create
    defaults: { _controller: 'App\Accounting\Controller\CustomerController::createAction' }
    methods:  POST

account_customer_edit:
    path:     /{id}/edit
    defaults: { _controller: 'App\Accounting\Controller\CustomerController::editAction' }

account_customer_update:
    path:     /{id}/update
    defaults: { _controller: 'App\Accounting\Controller\CustomerController::updateAction' }
    methods:  [POST, PUT]

account_customer_delete:
    path:     /{id}/delete
    defaults: { _controller: 'App\Accounting\Controller\CustomerController::deleteAction' }
    options:
           expose: true

account_customer_search:
    path:     /customer-search
    defaults: { _controller: 'App\Accounting\Controller\CustomerController::autoSearchAction' }
    options:
            expose: true

account_customer_name:
    path:      /{customer}/customer-name
    defaults: { _controller: 'App\Accounting\Controller\CustomerController::searchCustomerNameAction' }
    options:
           expose: true

account_customer_code_search:
    path:     /customer-code-search
    defaults: { _controller: 'App\Accounting\Controller\CustomerController::autoCodeSearchAction' }
    options:
            expose: true

account_customer_code:
    path:      /{customer}/customer-code
    defaults: { _controller: 'App\Accounting\Controller\CustomerController::searchCodeAction' }
    options:
           expose: true

account_location_search:
    path:     /location-search
    defaults: { _controller: 'App\Accounting\Controller\CustomerController::autoLocationSearchAction' }
    options:
            expose: true

account_location_name:
    path:      /{location}/location-name
    defaults: { _controller: 'App\Accounting\Controller\CustomerController::searchLocationNameAction' }
    options:
           expose: true

account_customer_auto_name_search:
    path:     /customer-auto-name-search
    defaults: { _controller: 'App\Accounting\Controller\CustomerController::searchAutoCompleteNameAction' }
    options:
           expose: true

account_customer_ledger:
    path:     /customer-ledger
    defaults: { _controller: 'App\Accounting\Controller\AccountSalesController::getCustomerLedgerAction' }
    options:
           expose: true

account_customer_sales_ledger:
    path:     /customer-sales-ledger
    defaults: { _controller: 'App\Accounting\Controller\AccountSalesController::getCustomerSalesLedgerAction' }
    options:
           expose: true


