# 2 route(s) repointed by check-routes.php: no such controller or action,
# so they answer 404 instead of a 500. See migration/contract/unresolvable-routes.md.
account_paymentsalary_employee:
    path: /salaery-employee
    defaults:
        _controller: 'App\Accounting\Controller\PaymentSalaryController::salaryEmployeeAction'
account_paymentsalary:
    path: /
    defaults:
        _controller: 'App\Accounting\Controller\PaymentSalaryController::indexAction'
account_paymentsalary_show:
    path: '/{user}/show'
    defaults:
        _controller: 'App\Accounting\Controller\PaymentSalaryController::showAction'
account_paymentsalary_new:
    path: '/{user}/new'
    defaults:
        _controller: 'App\Accounting\Controller\PaymentSalaryController::newAction'
account_paymentsalary_create:
    path: '/{user}/create'
    defaults:
        _controller: 'App\Accounting\Controller\PaymentSalaryController::createAction'
    methods: POST
account_paymentsalary_edit:
    path: '/{user}/edit'
    defaults:
        missing: 'App\Accounting\Controller\PaymentSalaryController::editAction'
    controller: App\Migration\Controller\UnresolvableRouteController
account_paymentsalary_update:
    path: '/{id}/update'
    defaults:
        missing: 'App\Accounting\Controller\PaymentSalaryController::updateAction'
    methods:
        - POST
        - PUT
    controller: App\Migration\Controller\UnresolvableRouteController
account_paymentsalary_delete:
    path: '/{id}/delete'
    defaults:
        _controller: 'App\Accounting\Controller\PaymentSalaryController::deleteAction'
account_paymentsalary_approve:
    path: '/{id}/payment-approve'
    defaults:
        _controller: 'App\Accounting\Controller\PaymentSalaryController::approveAction'
    options:
        expose: true
