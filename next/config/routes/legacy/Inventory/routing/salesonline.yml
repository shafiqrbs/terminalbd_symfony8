inventory_salesonline:
    path:     /
    defaults: { _controller: 'App\Inventory\Controller\SalesOnlineController::indexAction' }

inventory_salesonline_customer:
    path:     /customer
    defaults: { _controller: 'App\Inventory\Controller\SalesOnlineController::customerAction' }

inventory_salesonline_show:
    path:     /{id}/show
    defaults: { _controller: 'App\Inventory\Controller\SalesOnlineController::showAction' }

inventory_salesonline_show_preview:
    path:     /{id}/show-preview
    defaults: { _controller: 'App\Inventory\Controller\SalesOnlineController::showPreviewAction' }
    methods:  GET
    options:
            expose: true

inventory_salesonline_new:
    path:     /new
    defaults: { _controller: 'App\Inventory\Controller\SalesOnlineController::newAction' }

inventory_salesonline_edit:
    path:     /{code}/online
    defaults: { _controller: 'App\Inventory\Controller\SalesOnlineController::editAction' }

inventory_online_pos_print_individual:
    path:     /{id}/online-pos-print-indivisual
    defaults: { _controller: 'App\Inventory\Controller\SalesOnlineController::onlinePosPrintIndividualAction' }

inventory_salesonline_posprint:
    path:     /online-pos-print
    defaults: { _controller: 'App\Inventory\Controller\SalesOnlineController::onlinePosPrintAction' }
    methods:  [POST, PUT]
    options:
            expose: true

inventory_salesonline_update:
    path:     /{id}/update
    defaults: { _controller: 'App\Inventory\Controller\SalesOnlineController::updateAction' }
    methods:  [POST, PUT]

inventory_salesonline_print_invoice:
    path:     /{invoice}/invoice
    defaults: { _controller: 'App\Inventory\Controller\SalesOnlineController::invoicePrintAction' }

inventory_online_sales_reverse:
    path:     /{invoice}/invoice-reverse
    defaults: { _controller: 'App\Inventory\Controller\SalesOnlineController::reverseAction' }

inventory_online_invoice_group_approve:
    path:     /invoice-group-approve
    defaults: { _controller: 'App\Inventory\Controller\SalesOnlineController::invoiceGroupApprovedAction' }

inventory_salesonline_empty_delete:
    path:     /delete/empty-invoice
    defaults: { _controller: 'App\Inventory\Controller\SalesOnlineController::deleteEmptyInvoiceAction' }

inventory_salesonline_discount_update:
    path:     /sales/discount-update
    defaults: { _controller: 'App\Inventory\Controller\SalesOnlineController::salesDiscountUpdateAction' }
    methods:  POST
    options:
            expose: true

inventory_salesonline_item_create:
    path:     /{id}/create-item
    defaults: { _controller: 'App\Inventory\Controller\SalesOnlineController::createItemAction' }
    methods:  POST
    options:
            expose: true