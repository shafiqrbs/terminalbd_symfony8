inventory_salesgeneral:
    path:     /
    defaults: { _controller: 'App\Inventory\Controller\SalesGeneralController::indexAction' }

inventory_salesgeneral_customer:
    path:     /customer
    defaults: { _controller: 'App\Inventory\Controller\SalesGeneralController::customerAction' }

inventory_salesgeneral_show:
    path:     /{id}/show
    defaults: { _controller: 'App\Inventory\Controller\SalesGeneralController::showAction' }

inventory_salesgeneral_new:
    path:     /new
    defaults: { _controller: 'App\Inventory\Controller\SalesGeneralController::newAction' }

inventory_salesgeneral_edit:
    path:     /{code}/pos
    defaults: { _controller: 'App\Inventory\Controller\SalesGeneralController::editAction' }

inventory_salesgeneral_update:
    path:     /{id}/update
    defaults: { _controller: 'App\Inventory\Controller\SalesGeneralController::updateAction' }
    methods:  [POST, PUT]

inventory_salesgeneral_print_invoice:
    path:     /{invoice}/invoice
    defaults: { _controller: 'App\Inventory\Controller\SalesGeneralController::invoicePrintAction' }

inventory_salesgeneral_empty_delete:
    path:     /delete/empty-invoice
    defaults: { _controller: 'App\Inventory\Controller\SalesGeneralController::deleteEmptyInvoiceAction' }