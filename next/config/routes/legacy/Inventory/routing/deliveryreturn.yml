inventory_deliveryreturn:
    path:     /
    defaults: { _controller: 'App\Inventory\Controller\DeliveryReturnController::indexAction' }

inventory_deliveryreturn_show:
    path:     /{id}/show
    defaults: { _controller: 'App\Inventory\Controller\DeliveryReturnController::showAction' }

inventory_deliveryreturn_new:
    path:     /new
    defaults: { _controller: 'App\Inventory\Controller\DeliveryReturnController::newAction' }

inventory_deliveryreturn_create:
    path:     /create
    defaults: { _controller: 'App\Inventory\Controller\DeliveryReturnController::createAction' }
    methods:  POST

inventory_deliveryreturn_edit:
    path:     /{code}/pos
    defaults: { _controller: 'App\Inventory\Controller\DeliveryReturnController::editAction' }


inventory_deliveryreturn_approve:
    path:     /{id}/approve
    defaults: { _controller: 'App\Inventory\Controller\DeliveryReturnController::approveAction' }
    options:
           expose: true

inventory_deliveryreturn_update:
    path:     /{id}/update
    defaults: { _controller: 'App\Inventory\Controller\DeliveryReturnController::updateAction' }
    methods:  [POST, PUT]

inventory_deliveryreturn_delete:
    path:     /{id}/delete
    defaults: { _controller: 'App\Inventory\Controller\DeliveryReturnController::deleteAction' }

