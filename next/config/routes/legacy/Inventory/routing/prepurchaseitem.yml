prepurchaseitem:
    path:     /
    defaults: { _controller: 'App\Inventory\Controller\PrePurchaseItemController::indexAction' }

prepurchaseitem_show:
    path:     /{id}/show
    defaults: { _controller: 'App\Inventory\Controller\PrePurchaseItemController::showAction' }

prepurchaseitem_new:
    path:     /new
    defaults: { _controller: 'App\Inventory\Controller\PrePurchaseItemController::newAction' }

prepurchaseitem_create:
    path:     /create
    defaults: { _controller: 'App\Inventory\Controller\PrePurchaseItemController::createAction' }
