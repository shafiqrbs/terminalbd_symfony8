prepurchaseitem_edit:
    path:     /{id}/edit
    defaults: { _controller: 'App\Inventory\Controller\PrePurchaseItemController::editAction' }


prepurchaseitem_status:
    path:     /{id}/status
    defaults: { _controller: 'App\Inventory\Controller\PrePurchaseItemController::statusAction' }

prepurchaseitem_update:
    path:     /{id}/update
    defaults: { _controller: 'App\Inventory\Controller\PrePurchaseItemController::updateAction' }
    methods:  [POST, PUT]

prepurchaseitem_delete:
    path:     /{id}/delete
    defaults: { _controller: 'App\Inventory\Controller\PrePurchaseItemController::deleteAction' }
