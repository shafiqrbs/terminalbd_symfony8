inventory_stockitem:
    path:     /
    defaults: { _controller: 'App\Inventory\Controller\StockItemController::indexAction' }
    options:
        expose: true

inventory_stockitem_short_list:
    path:     /item-short-list
    defaults: { _controller: 'App\Inventory\Controller\StockItemController::itemShortListAction' }


inventory_stockitem_show:
    path:     /{item}/show
    defaults: { _controller: 'App\Inventory\Controller\StockItemController::showAction' }

inventory_stockitem_print:
    path:     /print
    defaults: { _controller: 'App\Inventory\Controller\StockItemController::printAction' }

inventory_barcode_branch_stock:
    path:     /barcode-wise-branch-stock
    defaults: { _controller: 'App\Inventory\Controller\StockItemController::barcodeBranchStockAction' }

inventory_barcode_stock:
    path:     /barcode-wise-stock
    defaults: { _controller: 'App\Inventory\Controller\StockItemController::barcodeStockAction' }

inventory_barcode_wise_branch_stock:
    path:     /{barcode}/single-barcode-wise-branch-stock
    defaults: { _controller: 'App\Inventory\Controller\StockItemController::singleBarcodeBranchStockAction' }
    methods:  GET
    options:
            expose: true