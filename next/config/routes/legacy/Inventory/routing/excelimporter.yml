inventory_excelimproter:
    path:     /
    defaults: { _controller: 'App\Inventory\Controller\ExcelImporterController::indexAction' }

inventory_excelimproter_migration:
    path:     /{id}/data-migration
    defaults: { _controller: 'App\Inventory\Controller\ExcelImporterController::excelDataImportAction' }

inventory_excelimproter_new:
    path:     /new
    defaults: { _controller: 'App\Inventory\Controller\ExcelImporterController::newAction' }

inventory_excelimproter_create:
    path:     /create
    defaults: { _controller: 'App\Inventory\Controller\ExcelImporterController::createAction' }
    methods:  POST

inventory_excelimproter_edit:
    path:     /{id}/edit
    defaults: { _controller: 'App\Inventory\Controller\ExcelImporterController::editAction' }

inventory_excelimproter_update:
    path:     /{id}/update
    defaults: { _controller: 'App\Inventory\Controller\ExcelImporterController::updateAction' }
    methods:  [POST, PUT]

inventory_excelimproter_delete:
    path:     /{id}/delete
    defaults: { _controller: 'App\Inventory\Controller\ExcelImporterController::deleteAction' }


inventory_excelimproter_updated:
    path:     /{id}/data-updated
    defaults: { _controller: 'App\Inventory\Controller\ExcelImporterController::updatedAction' }

inventory_excelimproter_reset:
    path:     /{ic}/data-reseted
    defaults: { _controller: 'App\Inventory\Controller\ExcelImporterController::resetedAction' }

inventory_excelimproter_restore:
    path:     /{ic}/data-restored
    defaults: { _controller: 'App\Inventory\Controller\ExcelImporterController::restoredAction' }
