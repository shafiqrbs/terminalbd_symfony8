sidebar_widget:
    path:     /
    defaults: { _controller: 'App\Tool\Controller\SidebarWidgetController::indexAction' }

sidebar_widget_show:
    path:     /{id}/show
    defaults: { _controller: 'App\Tool\Controller\SidebarWidgetController::showAction' }

sidebar_widget_new:
    path:     /new
    defaults: { _controller: 'App\Tool\Controller\SidebarWidgetController::newAction' }

sidebar_widget_create:
    path:     /create
    defaults: { _controller: 'App\Tool\Controller\SidebarWidgetController::createAction' }
    methods:  POST

sidebar_widget_edit:
    path:     /{id}/edit
    defaults: { _controller: 'App\Tool\Controller\SidebarWidgetController::editAction' }

sidebar_widget_update:
    path:     /{id}/update
    defaults: { _controller: 'App\Tool\Controller\SidebarWidgetController::updateAction' }
    methods:  [POST, PUT]

sidebar_widget_delete:
    path:     /{id}/delete
    defaults: { _controller: 'App\Tool\Controller\SidebarWidgetController::deleteAction' }
    methods:  [POST, DELETE]
