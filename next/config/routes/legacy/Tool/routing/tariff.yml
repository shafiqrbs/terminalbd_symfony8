# 11 route(s) repointed by check-routes.php: no such controller or action,
# so they answer 404 instead of a 500. See migration/contract/unresolvable-routes.md.
taxtariff:
    path: /
    defaults:
        missing: 'TallyBundle:TaxTariff:index'
    controller: App\Migration\Controller\UnresolvableRouteController
taxtariff_show:
    path: '/{id}/show'
    defaults:
        missing: 'TallyBundle:TaxTariff:show'
    controller: App\Migration\Controller\UnresolvableRouteController
taxtariff_new:
    path: /new
    defaults:
        missing: 'TallyBundle:TaxTariff:new'
    controller: App\Migration\Controller\UnresolvableRouteController
taxtariff_create:
    path: /create
    defaults:
        missing: 'TallyBundle:TaxTariff:create'
    methods: POST
    controller: App\Migration\Controller\UnresolvableRouteController
taxtariff_edit:
    path: '/{id}/edit'
    defaults:
        missing: 'TallyBundle:TaxTariff:edit'
    controller: App\Migration\Controller\UnresolvableRouteController
taxtariff_update:
    path: '/{id}/update'
    defaults:
        missing: 'TallyBundle:TaxTariff:update'
    methods:
        - POST
        - PUT
    controller: App\Migration\Controller\UnresolvableRouteController
taxtariff_inline_update:
    path: '/{id}/inline-update'
    defaults:
        missing: 'TallyBundle:TaxTariff:inlineUpdate'
    methods: POST
    options:
        expose: true
    controller: App\Migration\Controller\UnresolvableRouteController
taxtariff_delete:
    path: '/{id}/delete'
    defaults:
        missing: 'TallyBundle:TaxTariff:delete'
    controller: App\Migration\Controller\UnresolvableRouteController
taxtariff_status:
    path: '/{id}/status'
    defaults:
        missing: 'TallyBundle:TaxTariff:status'
    controller: App\Migration\Controller\UnresolvableRouteController
tallyitem_item_search:
    path: /search-tariff
    defaults:
        missing: 'TallyBundle:TaxTariff:autoSearch'
    options:
        expose: true
    controller: App\Migration\Controller\UnresolvableRouteController
tallyitem_item_name:
    path: '/{name}/tariff-name'
    defaults:
        missing: 'TallyBundle:TaxTariff:searchName'
    options:
        expose: true
    controller: App\Migration\Controller\UnresolvableRouteController
