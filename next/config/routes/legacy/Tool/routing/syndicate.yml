syndicate:
    path:     /
    defaults: { _controller: 'App\Tool\Controller\SyndicateController::indexAction' }

syndicate_show:
    path:     /{id}/show
    defaults: { _controller: 'App\Tool\Controller\SyndicateController::showAction' }

syndicate_new:
    path:     /new
    defaults: { _controller: 'App\Tool\Controller\SyndicateController::newAction' }

syndicate_create:
    path:     /create
    defaults: { _controller: 'App\Tool\Controller\SyndicateController::createAction' }
    requirements: { _method: post }

syndicate_edit:
    path:     /{id}/edit
    defaults: { _controller: 'App\Tool\Controller\SyndicateController::editAction' }

syndicate_update:
    path:     /{id}/update
    defaults: { _controller: 'App\Tool\Controller\SyndicateController::updateAction' }
    requirements: { _method: post|put }

syndicate_delete:
    path:     /{id}/delete
    defaults: { _controller: 'App\Tool\Controller\SyndicateController::deleteAction' }

syndicate_status:
    path:     /{id}/status
    defaults: { _controller: 'App\Tool\Controller\SyndicateController::statusAction' }

