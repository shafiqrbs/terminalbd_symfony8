appmodule:
    path:     /
    defaults: { _controller: 'App\Tool\Controller\AppModuleController::indexAction' }

appmodule_show:
    path:     /{id}/show
    defaults: { _controller: 'App\Tool\Controller\AppModuleController::showAction' }

appmodule_new:
    path:     /new
    defaults: { _controller: 'App\Tool\Controller\AppModuleController::newAction' }

appmodule_create:
    path:     /create
    defaults: { _controller: 'App\Tool\Controller\AppModuleController::createAction' }
    methods:  POST

appmodule_edit:
    path:     /{id}/edit
    defaults: { _controller: 'App\Tool\Controller\AppModuleController::editAction' }

appmodule_update:
    path:     /{id}/update
    defaults: { _controller: 'App\Tool\Controller\AppModuleController::updateAction' }
    methods:  [POST, PUT]

appmodule_delete:
    path:     /{id}/delete
    defaults: { _controller: 'App\Tool\Controller\AppModuleController::deleteAction' }

appmodule_status:
    path:     /{id}/status
    defaults: { _controller: 'App\Tool\Controller\AppModuleController::statusAction' }

