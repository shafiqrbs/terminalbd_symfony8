medicinebrand:
    path:     /
    defaults: { _controller: 'App\Tool\Controller\MedicineController::indexAction' }

medicinebrand_new:
    path:     /new
    defaults: { _controller: 'App\Tool\Controller\MedicineController::newAction' }

medicinebrand_create:
    path:     /create
    defaults: { _controller: 'App\Tool\Controller\MedicineController::createAction' }
    methods:  POST

medicinebrand_edit:
    path:     /{id}/edit
    defaults: { _controller: 'App\Tool\Controller\MedicineController::editAction' }

medicinebrand_copy:
    path:     /{id}/copy
    defaults: { _controller: 'App\Tool\Controller\MedicineController::copyAction' }

medicinebrand_delete:
