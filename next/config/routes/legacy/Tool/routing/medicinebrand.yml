    defaults: { _controller: 'App\Tool\Controller\MedicineController::statusAction' }

medicinebrand_update:
    path:     /{id}/update
    defaults: { _controller: 'App\Tool\Controller\MedicineController::updateAction' }
    methods:  [POST, PUT]

medicinebrand_select_search:
    path:     /select-medicine-search
    defaults: { _controller: 'App\Tool\Controller\MedicineController::selectSearchMedicineAction' }
    options:
            expose: true

