color:
    path:     /
    defaults: { _controller: 'App\Tool\Controller\ColorController::indexAction' }

color_show:
    path:     /{id}/show
    defaults: { _controller: 'App\Tool\Controller\ColorController::showAction' }

color_new:
    path:     /new
    defaults: { _controller: 'App\Tool\Controller\ColorController::newAction' }

color_create:
    path:     /create
    defaults: { _controller: 'App\Tool\Controller\ColorController::createAction' }
    methods:  POST

color_edit:
    path:     /{id}/edit
    defaults: { _controller: 'App\Tool\Controller\ColorController::editAction' }

color_update:
    path:     /{id}/update
    defaults: { _controller: 'App\Tool\Controller\ColorController::updateAction' }
    methods:  [POST, PUT]

color_delete:
    path:     /{id}/delete
    defaults: { _controller: 'App\Tool\Controller\ColorController::deleteAction' }
    methods:  [POST, DELETE]


