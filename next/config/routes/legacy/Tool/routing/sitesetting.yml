sitesetting:
    path:     /
    defaults: { _controller: 'App\Tool\Controller\SiteSettingController::indexAction' }

sitesetting_show:
    path:     /{id}/show
    defaults: { _controller: 'App\Tool\Controller\SiteSettingController::showAction' }

sitesetting_new:
    path:     /new
    defaults: { _controller: 'App\Tool\Controller\SiteSettingController::newAction' }

sitesetting_create:
    path:     /create
    defaults: { _controller: 'App\Tool\Controller\SiteSettingController::createAction' }
    requirements: { _method: post }

sitesetting_edit:
    path:     /{id}/edit
    defaults: { _controller: 'App\Tool\Controller\SiteSettingController::editAction' }

sitesetting_update:
    path:     /{id}/update
    defaults: { _controller: 'App\Tool\Controller\SiteSettingController::updateAction' }
    requirements: { _method: post|put }

sitesetting_delete:
    path:     /{id}/delete
    defaults: { _controller: 'App\Tool\Controller\SiteSettingController::deleteAction' }
    requirements: { _method: post|delete }

sitesetting_modify:
    path:     /modify
    defaults: { _controller: 'App\Tool\Controller\SiteSettingController::modifyAction' }