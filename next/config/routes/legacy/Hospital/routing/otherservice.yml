hms_other_service:
    path:     /
    defaults: { _controller: 'App\Hospital\Controller\OtherServiceController::indexAction' }

hms_other_service_create:
    path:     /create
    defaults: { _controller: 'App\Hospital\Controller\OtherServiceController::createAction' }
    methods:  POST

hms_other_service_edit:
    path:     /{id}/edit
    defaults: { _controller: 'App\Hospital\Controller\OtherServiceController::editAction' }

hms_other_service_update:
    path:     /{id}/update
    defaults: { _controller: 'App\Hospital\Controller\OtherServiceController::updateAction' }
    methods:  [POST, PUT]

hms_other_service_delete:
    path:     /{id}/delete
    defaults: { _controller: 'App\Hospital\Controller\OtherServiceController::deleteAction' }

hms_other_service_status:
    path:     /{id}/status
    defaults: { _controller: 'App\Hospital\Controller\OtherServiceController::statusAction' }