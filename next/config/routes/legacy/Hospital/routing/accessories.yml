hms_accessories:
    path:     /
    defaults: { _controller: 'App\Hospital\Controller\AccessoriesController::indexAction' }

hms_accessories_create:
    path:     /create
    defaults: { _controller: 'App\Hospital\Controller\AccessoriesController::createAction' }
    methods:  POST

hms_accessories_edit:
    path:     /{id}/edit
    defaults: { _controller: 'App\Hospital\Controller\AccessoriesController::editAction' }

hms_accessories_update:
    path:     /{id}/update
    defaults: { _controller: 'App\Hospital\Controller\AccessoriesController::updateAction' }
    methods:  [POST, PUT]

hms_accessories_delete:
    path:     /{id}/delete
    defaults: { _controller: 'App\Hospital\Controller\AccessoriesController::deleteAction' }

hms_accessories_status:
    path:     /{id}/status
    defaults: { _controller: 'App\Hospital\Controller\AccessoriesController::statusAction' }

hms_accessories_inline:
    path:     /inline-update
    defaults: { _controller: 'App\Hospital\Controller\AccessoriesController::inlineUpdateAction' }