hms_cabin:
    path:     /
    defaults: { _controller: 'App\Hospital\Controller\CabinController::indexAction' }

hms_cabin_create:
    path:     /create
    defaults: { _controller: 'App\Hospital\Controller\CabinController::createAction' }
    methods:  POST

hms_cabin_edit:
    path:     /{id}/edit
    defaults: { _controller: 'App\Hospital\Controller\CabinController::editAction' }

hms_cabin_update:
    path:     /{id}/update
    defaults: { _controller: 'App\Hospital\Controller\CabinController::updateAction' }
    methods:  [POST, PUT]

hms_cabin_delete:
    path:     /{id}/delete
    defaults: { _controller: 'App\Hospital\Controller\CabinController::deleteAction' }

hms_cabin_status:
    path:     /{id}/status
    defaults: { _controller: 'App\Hospital\Controller\CabinController::statusAction' }