homepage:
    path:     /backend
    defaults: { _controller: 'App\User\Controller\DefaultController::landingAction' }

admin:
    path: /admin
    defaults: { _controller: App\User\Controller\DefaultController::adminAction }

vendor:
    path: /vendor
    defaults: { _controller: App\User\Controller\DefaultController::vendorAction }

domain:
    path: /domain
    defaults: { _controller: App\User\Controller\DefaultController::domainAction }

website:
    path: /website
    defaults: { _controller: App\User\Controller\DefaultController::websiteAction }

customer:
    path: /customer
    defaults:  { _controller: App\Customer\Controller\DomainController::indexAction }

domain_pendig:
    path: /domain-pendeing
    defaults: { _controller: App\User\Controller\DefaultController::pendeingAction }

domain_suspended:
    path: /domain-suspended
    defaults: { _controller: App\User\Controller\DefaultController::suspendedAction }

tutor:
    path: /tutor
    defaults: { _controller: App\User\Controller\DefaultController::tutorAction }

general:
    path: /general
    defaults: { _controller: App\User\Controller\DefaultController::generalAction }

landing_page:
     path: /user-admin
     defaults: { _controller: App\User\Controller\DefaultController::landingAction }


user_deactive:
    path: /user/deactive/{id}
    defaults: { _controller: App\User\Controller\UserController::userDeactiveAction }
    requirements:
          id: \d+

user_active:
    path: /user/active/{id}
    defaults: { _controller: App\User\Controller\UserController::userActiveAction }
    requirements:
          id: \d+

username_check:
    path: /username/check
    defaults: { _controller: App\User\Controller\UserController::usernameCheckAction }
    options:
            expose: true

email_check:
    path: /email/check
    defaults: { _controller: App\User\Controller\UserController::emailCheckAction }
    options:
            expose: true

user_auto_search:
    path: /user/search
    defaults: { _controller: App\User\Controller\UserController::autoSearchAction }
    options:
            expose: true

