appearancefeaturewidget:
    path:     /
    defaults: { _controller: 'App\Appearance\Controller\FeatureWidgetController::indexAction' }

appearancefeaturewidget_sorting:
    path:     /sorting
    defaults: { _controller: 'App\Appearance\Controller\FeatureWidgetController::sortingAction' }

appearancefeaturewidget_list_sorted:
    path:     /sorted-list
    defaults: { _controller: 'App\Appearance\Controller\FeatureWidgetController::sortedListAction' }

appearancefeaturewidget_show:
    path:     /{id}/show
    defaults: { _controller: 'App\Appearance\Controller\FeatureWidgetController::showAction' }

appearancefeaturewidget_new:
    path:     /new
    defaults: { _controller: 'App\Appearance\Controller\FeatureWidgetController::newAction' }

appearancefeaturewidget_create:
