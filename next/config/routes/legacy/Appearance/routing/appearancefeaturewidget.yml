appearancefeaturewidget_feature:
    path:     /{id}/feature
    defaults: { _controller: 'App\Appearance\Controller\FeatureWidgetController::featureAction' }

appearancefeaturewidget_edit:
    path:     /{id}/edit
    defaults: { _controller: 'App\Appearance\Controller\FeatureWidgetController::editAction' }

appearancefeaturewidget_update:
    path:     /{id}/update
    defaults: { _controller: 'App\Appearance\Controller\FeatureWidgetController::updateAction' }
