appearancefeaturewidget_delete:
    path:     /{id}/delete
    defaults: { _controller: 'App\Appearance\Controller\FeatureWidgetController::deleteAction' }

appearancefeaturewidget_status:
    path:     /{id}/status
    defaults: { _controller: 'App\Appearance\Controller\FeatureWidgetController::statusAction' }

appearancefeaturewidget_resizing:
    path:     /resizing
    defaults: { _controller: 'App\Appearance\Controller\FeatureWidgetController::resizeAction' }

appearancefeaturewidget_sorted:
    path:     /sorted
    defaults: { _controller: 'App\Appearance\Controller\FeatureWidgetController::sortedAction' }
