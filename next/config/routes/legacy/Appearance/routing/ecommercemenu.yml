ecommercemenu:
    path:     /
    defaults: { _controller: 'App\Appearance\Controller\EcommerceMenuController::indexAction' }

ecommercemenu_new:
    path:     /new
    defaults: { _controller: 'App\Appearance\Controller\EcommerceMenuController::newAction' }

ecommercemenu_create:
    path:     /create
    defaults: { _controller: 'App\Appearance\Controller\EcommerceMenuController::createAction' }
    methods:  POST

ecommercemenu_edit:
    path:     /{id}/edit
    defaults: { _controller: 'App\Appearance\Controller\EcommerceMenuController::editAction' }

ecommercemenu_update:
    path:     /{id}/update
    defaults: { _controller: 'App\Appearance\Controller\EcommerceMenuController::updateAction' }
    methods:  [POST, PUT]

ecommercemenu_delete:
    path:     /{id}/delete
    defaults: { _controller: 'App\Appearance\Controller\EcommerceMenuController::deleteAction' }


ecommercemenu_sorted:
    path:     /sorted
    defaults: { _controller: 'App\Appearance\Controller\EcommerceMenuController::sortedAction' }

ecommercemenu_status:
    path:     /{id}/status
    defaults: { _controller: 'App\Appearance\Controller\EcommerceMenuController::statusAction' }

