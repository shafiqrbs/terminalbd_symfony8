# 10 route(s) repointed by check-routes.php: no such controller or action,
# so they answer 404 instead of a 500. See migration/contract/unresolvable-routes.md.
appearancefeature:
    path: /
    defaults:
        missing: App\Appearance\Controller\FeatureController
    controller: App\Migration\Controller\UnresolvableRouteController
appearancefeature_show:
    path: '/{id}/show'
    defaults:
        missing: App\Appearance\Controller\FeatureController
    controller: App\Migration\Controller\UnresolvableRouteController
appearancefeature_new:
    path: /new
    defaults:
        missing: App\Appearance\Controller\FeatureController
    controller: App\Migration\Controller\UnresolvableRouteController
appearancefeature_create:
    path: /create
    defaults:
        missing: App\Appearance\Controller\FeatureController
    methods: POST
    controller: App\Migration\Controller\UnresolvableRouteController
appearancefeature_edit:
    path: '/{id}/edit'
    defaults:
        missing: App\Appearance\Controller\FeatureController
    controller: App\Migration\Controller\UnresolvableRouteController
appearancefeature_update:
    path: '/{id}/update'
    defaults:
        missing: App\Appearance\Controller\FeatureController
    methods:
        - POST
        - PUT
    controller: App\Migration\Controller\UnresolvableRouteController
appearancefeature_delete:
    path: '/{id}/delete'
    defaults:
        missing: App\Appearance\Controller\FeatureController
    controller: App\Migration\Controller\UnresolvableRouteController
appearancefeature_status:
    path: '/{id}/status'
    defaults:
        missing: App\Appearance\Controller\FeatureController
    controller: App\Migration\Controller\UnresolvableRouteController
appearancefeature_resizing:
    path: /resizing
    defaults:
        missing: App\Appearance\Controller\FeatureController
    controller: App\Migration\Controller\UnresolvableRouteController
appearancefeature_sorted:
    path: /sorted
    defaults:
        missing: App\Appearance\Controller\FeatureController
    controller: App\Migration\Controller\UnresolvableRouteController
