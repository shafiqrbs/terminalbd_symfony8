featurecategory:
    path:     /
    defaults: { _controller: 'App\Appearance\Controller\FeatureCategoryController::indexAction' }

featurecategory_sorting:
    path:     /sorting
    defaults: { _controller: 'App\Appearance\Controller\FeatureCategoryController::sortingAction' }

featurecategory_show:
    path:     /{id}/show
    defaults: { _controller: 'App\Appearance\Controller\FeatureCategoryController::showAction' }

featurecategory_new:
    path:     /new
    defaults: { _controller: 'App\Appearance\Controller\FeatureCategoryController::newAction' }

featurecategory_create:
    path:     /create
    defaults: { _controller: 'App\Appearance\Controller\FeatureCategoryController::createAction' }
    methods:  POST

featurecategory_edit:
    path:     /{id}/edit
    defaults: { _controller: 'App\Appearance\Controller\FeatureCategoryController::editAction' }

featurecategory_update:
    path:     /{id}/update
    defaults: { _controller: 'App\Appearance\Controller\FeatureCategoryController::updateAction' }
    methods:  [POST, PUT]

featurecategory_delete:
    path:     /{id}/delete
    defaults: { _controller: 'App\Appearance\Controller\FeatureCategoryController::deleteAction' }

featurecategory_status:
    path:     /{id}/status
    defaults: { _controller: 'App\Appearance\Controller\FeatureCategoryController::statusAction' }
