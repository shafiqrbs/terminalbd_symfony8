restaurant_purchase:
    path:     /
    defaults: { _controller: 'App\Restaurant\Controller\PurchaseController::indexAction' }

restaurant_purchase_show:
    path:     /{id}/show
    defaults: { _controller: 'App\Restaurant\Controller\PurchaseController::showAction' }

restaurant_purchase_new:
    path:     /new
    defaults: { _controller: 'App\Restaurant\Controller\PurchaseController::newAction' }

restaurant_purchase_edit:
    path:     /{id}/edit
    defaults: { _controller: 'App\Restaurant\Controller\PurchaseController::editAction' }

restaurant_purchase_update:
    path:     /{id}/update
    defaults: { _controller: 'App\Restaurant\Controller\PurchaseController::updateAction' }
    methods:  [POST, PUT]

restaurant_purchase_status:
    path:     /{id}/status
    defaults: { _controller: 'App\Restaurant\Controller\PurchaseController::editAction' }


restaurant_purchase_approve:
    path:     /{id}/approve
    defaults: { _controller: 'App\Restaurant\Controller\PurchaseController::approveAction' }

restaurant_purchase_reverse:
    path:     /{id}/reverse
    defaults: { _controller: 'App\Restaurant\Controller\PurchaseController::reverseAction' }

restaurant_purchase_delete:
    path:     /{id}/delete
    defaults: { _controller: 'App\Restaurant\Controller\PurchaseController::deleteAction' }

restaurant_purchase_particular_search:
    path:     /{id}/particular-search
    defaults: { _controller: 'App\Restaurant\Controller\PurchaseController::particularSearchAction' }


restaurant_purchase_particular_add:
    path:     /{invoice}/particular-add
    defaults: { _controller: 'App\Restaurant\Controller\PurchaseController::addParticularAction' }
    methods:  POST
    options:
            expose: true

restaurant_purchase_discount_update:
    path:     /purchase/dicount-update
    defaults: { _controller: 'App\Restaurant\Controller\PurchaseController::invoiceDiscountUpdateAction' }
    methods:  POST
    options:
            expose: true

restaurant_purchase_approved:
    path:     /{id}/invoice-approved
    defaults: { _controller: 'App\Restaurant\Controller\PurchaseController::approvedAction' }


restaurant_purchase_particular_delete:
    path:     /{invoice}/{id}/particular-delete
    defaults: { _controller: 'App\Restaurant\Controller\PurchaseController::invoiceParticularDeleteAction' }

restaurant_purchase_print_invoice:
    path:     /{id}/print
    defaults: { _controller: 'App\Restaurant\Controller\PurchaseController::invoicePrintAction' }