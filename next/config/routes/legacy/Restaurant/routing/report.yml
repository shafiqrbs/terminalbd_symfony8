# 2 route(s) repointed by check-routes.php: no such controller or action,
# so they answer 404 instead of a 500. See migration/contract/unresolvable-routes.md.
restaurant_report_sales_summary:
    path: /sales-summary
    defaults:
        _controller: 'App\Restaurant\Controller\ReportController::salesSummaryAction'
restaurant_report_sales_details:
    path: /sales-details
    defaults:
        _controller: 'App\Restaurant\Controller\ReportController::salesDetailsAction'
restaurant_report_sales_user:
    path: /user-wise-sales
    defaults:
        _controller: 'App\Restaurant\Controller\ReportController::userBaseSalesSummaryAction'
restaurant_report_sales_category:
    path: /category-wise-sales
    defaults:
        _controller: 'App\Restaurant\Controller\ReportController::categoryBaseSalesSummaryAction'
restaurant_report_sales_group:
    path: /group-wise-sales
    defaults:
        _controller: 'App\Restaurant\Controller\ReportController::productGroupBaseSalesSummaryAction'
restaurant_report_sales_product:
    path: /product-wise-sales
    defaults:
        _controller: 'App\Restaurant\Controller\ReportController::productBaseSalesSummaryAction'
restaurant_report_purchase_summary:
    path: /purchase-summary
    defaults:
        missing: 'App\Restaurant\Controller\ReportController::purchaseSummaryAction'
    controller: App\Migration\Controller\UnresolvableRouteController
restaurant_report_stock:
    path: /stock-summary
    defaults:
        missing: 'App\Restaurant\Controller\ReportController::stockAction'
    controller: App\Migration\Controller\UnresolvableRouteController
