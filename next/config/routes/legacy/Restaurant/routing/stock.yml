restaurant_stock:
    path:     /
    defaults: { _controller: 'App\Restaurant\Controller\StockController::indexAction' }

restaurant_stock_create:
    path:     /create
    defaults: { _controller: 'App\Restaurant\Controller\StockController::createAction' }
    methods:  POST

restaurant_stock_edit:
    path:     /{id}/edit
    defaults: { _controller: 'App\Restaurant\Controller\StockController::editAction' }

restaurant_stock_copy:
    path:     /{id}/copy
    defaults: { _controller: 'App\Restaurant\Controller\StockController::copyAction' }

restaurant_stock_update:
    path:     /{id}/update
    defaults: { _controller: 'App\Restaurant\Controller\StockController::updateAction' }
    methods:  [POST, PUT]

restaurant_stock_delete:
    path:     /{id}/delete
    defaults: { _controller: 'App\Restaurant\Controller\StockController::deleteAction' }

restaurant_stock_status:
    path:     /{id}/status
    defaults: { _controller: 'App\Restaurant\Controller\StockController::statusAction' }

restaurant_stock_inline:
    path:     /inline-update
    defaults: { _controller: 'App\Restaurant\Controller\StockController::inlineUpdateAction' }

restaurant_stock_update_price:
    path:     /production-price-update
    defaults: { _controller: 'App\Restaurant\Controller\StockController::productionUpdateAction' }