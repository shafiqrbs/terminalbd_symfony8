order:
    path:     /
    defaults: { _controller: 'App\Customer\Controller\OrderController::indexAction' }

shoppingbag_to_order:
    path:     /shopping-bag-to-order
    defaults: { _controller: 'App\Customer\Controller\OrderController::wishToOrderAction' }

wishlist_to_cart:
    path:     /wishlist-to-order
    defaults: { _controller: 'App\Customer\Controller\OrderController::wishToOrderAction' }


order_to_cart:
    path:     /inbox-to-order
    defaults: { _controller: 'App\Customer\Controller\OrderController::cartToOrderAction' }

order_checkout:
    path:     /cart-to-order
    defaults: { _controller: 'App\Customer\Controller\OrderController::cartToOrderAction' }

order_cart:
    path:     /order-cart
    defaults: { _controller: 'App\Customer\Controller\OrderController::cartAction' }

order_payment:
    path:     /{id}/payment
    defaults: { _controller: 'App\Customer\Controller\OrderController::paymentAction' }

order_process:
    path:      /{id}/order-process
    defaults: { _controller: 'App\Customer\Controller\OrderController::processConfirmAction' }

order_show:
    path:      /{id}/order-show
    defaults: { _controller: 'App\Customer\Controller\OrderController::showAction' }

order_delete:
    path:      /{id}/order-delete
    defaults: { _controller: 'App\Customer\Controller\OrderController::deleteAction' }

order_item_update:
    path:      /{order}/{id}/order-item-update
    defaults: { _controller: 'App\Customer\Controller\OrderController::itemUpdateAction' }

order_item_delete:
    path:      /{order}/{id}/order-item-delete
    defaults: { _controller: 'App\Customer\Controller\OrderController::itemDeleteAction' }

order_print_invoice:
    path:     /{invoice}/invoice-print
    defaults: { _controller: 'App\Customer\Controller\OrderController::printAction' }

order_ajax_payment:
    path:      /{id}/order-payment
    defaults: { _controller: 'App\Customer\Controller\OrderController::paymentProcessAction' }
    methods:  [POST]

order_payment_delete:
    path:      /{id}/order-payment-delete
    defaults: { _controller: 'App\Customer\Controller\OrderController::paymentDeleteAction' }

order_attach_download:
    path:      /{id}/attach-download
    defaults: { _controller: 'App\Customer\Controller\OrderController::downloadAttachFileAction' }

medicine_customer_order_stock_search:
    path:     /order-stock-product-search
    defaults: { _controller: 'App\Customer\Controller\OrderController::autoSearchAction' }
    options:
            expose: true

order_item_stock_details:
    path:     /order-stock-item-search
    defaults: { _controller: 'App\Customer\Controller\OrderController::stockDetailsAction' }
    options:
            expose: true

medicine_order_item:
    path:    /{id}/customer-order-item-add
    defaults: { _controller: 'App\Customer\Controller\OrderController::itemAddAction' }
    methods:  POST
    options:
            expose: true


