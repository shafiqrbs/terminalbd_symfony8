# 1 route(s) repointed by check-routes.php: no such controller or action,
# so they answer 404 instead of a 500. See migration/contract/unresolvable-routes.md.
daily_attendance:
    path: /
    defaults:
        _controller: 'App\HumanResource\Controller\DailyAttendanceController::indexAction'
daily_attendance_show:
    path: '/{month}/{year}/show'
    defaults:
        _controller: 'App\HumanResource\Controller\DailyAttendanceController::showAction'
daily_attendance_month:
    path: /current-month
    defaults:
        _controller: 'App\HumanResource\Controller\DailyAttendanceController::attendanceAction'
daily_attendance_menual:
    path: /attendance-menual
    defaults:
        _controller: 'App\HumanResource\Controller\DailyAttendanceController::manualAttendanceAction'
daily_attendance_menual_create:
    path: /attendance-menual-create
    defaults:
        missing: 'App\HumanResource\Controller\DailyAttendanceController::manualAttendanceCreateAction'
    methods: POST
    controller: App\Migration\Controller\UnresolvableRouteController
daily_attendance_add:
    path: '/{id}/add'
    defaults:
        _controller: 'App\HumanResource\Controller\DailyAttendanceController::addAttendanceAction'
    options:
        expose: true
