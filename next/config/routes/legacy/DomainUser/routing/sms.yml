domainuser_sms:
    path:     /
    defaults: { _controller: 'App\DomainUser\Controller\CustomerSmsController::indexAction' }

domainuser_member_sms:
    path:     /{id}/member
    defaults: { _controller: 'App\DomainUser\Controller\CustomerSmsController::memberAction' }

domainuser_event_sms:
    path:     /{id}/event
    defaults: { _controller: 'App\DomainUser\Controller\CustomerSmsController::eventAction' }

domainuser_committee_sms:
    path:     /{id}/committee
    defaults: { _controller: 'App\DomainUser\Controller\CustomerSmsController::committeeAction' }

domainuser_votecenter_sms:
    path:     /{id}/vote-center
    defaults: { _controller: 'App\DomainUser\Controller\CustomerSmsController::voteCenterAction' }

domainuser_sms_new:
    path:     /new
    defaults: { _controller: 'App\DomainUser\Controller\CustomerSmsController::newAction' }

domainuser_sms_show:
    path:     /{id}/show
    defaults: { _controller: 'App\DomainUser\Controller\CustomerSmsController::showAction' }
    options:
            expose: true

domainuser_sms_search:
    path:     /search
    defaults: { _controller: 'App\DomainUser\Controller\CustomerSmsController::autoSearchAction' }
    options:
            expose: true

domainuser_sms_name:
    path:      /{particular}/particular-name
    defaults: { _controller: 'App\DomainUser\Controller\CustomerSmsController::searchSmsNameAction' }
    options:
            expose: true

domainuser_sms_create:
    path:     /create
    defaults: { _controller: 'App\DomainUser\Controller\CustomerSmsController::createAction' }
    methods:  POST

domainuser_sms_edit:
    path:     /{id}/edit
    defaults: { _controller: 'App\DomainUser\Controller\CustomerSmsController::editAction' }

domainuser_sms_update:
    path:     /{id}/update
    defaults: { _controller: 'App\DomainUser\Controller\CustomerSmsController::updateAction' }
    methods:  [POST, PUT]

domainuser_sms_status:
    path:     /{id}/status
    defaults: { _controller: 'App\DomainUser\Controller\CustomerSmsController::statusAction' }

domainuser_sms_delete:
    path:     /{id}/delete
    defaults: { _controller: 'App\DomainUser\Controller\CustomerSmsController::deleteAction' }

domainuser_bulk_sms:
    path:     /{id}/bluk
    defaults: { _controller: 'App\DomainUser\Controller\CustomerSmsController::bulkSmsAction' }


