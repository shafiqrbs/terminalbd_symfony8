# 1 route(s) repointed by check-routes.php: no such controller or action,
# so they answer 404 instead of a 500. See migration/contract/unresolvable-routes.md.
domain_store:
    path: /
    defaults:
        missing: App\DomainUser\Controller\StoreController
    controller: App\Migration\Controller\UnresolvableRouteController
domain_store_employee:
    path: '/{id}/branches-employee'
    defaults:
        _controller: 'App\DomainUser\Controller\BranchesController::branchesEmployeeAction'
domain_store_show:
    path: '/{id}/show'
    defaults:
        _controller: 'App\DomainUser\Controller\BranchesController::showAction'
domain_store_new:
    path: /new
    defaults:
        _controller: 'App\DomainUser\Controller\BranchesController::newAction'
domain_store_create:
    path: /create
    defaults:
        _controller: 'App\DomainUser\Controller\BranchesController::createAction'
    methods: POST
domain_store_edit:
    path: '/{id}/edit'
    defaults:
        _controller: 'App\DomainUser\Controller\BranchesController::editAction'
domain_store_update:
    path: '/{id}/update'
    defaults:
        _controller: 'App\DomainUser\Controller\BranchesController::updateAction'
    methods:
        - POST
        - PUT
domain_store_delete:
    path: '/{id}/delete'
    defaults:
        _controller: 'App\DomainUser\Controller\BranchesController::deleteAction'
