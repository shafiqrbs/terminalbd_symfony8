# 1 route(s) repointed by check-routes.php: no such controller or action,
# so they answer 404 instead of a 500. See migration/contract/unresolvable-routes.md.
galleries:
    path: /
    defaults:
        _controller: 'App\Media\Controller\PhotoGalleryController::indexAction'
galleries_delete_list:
    path: /delete/lists
    defaults:
        missing: 'App\Media\Controller\PhotoGalleryController::galleriesDeleteAction'
    controller: App\Migration\Controller\UnresolvableRouteController
gallery:
    path: /
    defaults:
        _controller: 'App\Media\Controller\PhotoGalleryController::galleryAction'
gallery_delete_list:
    path: /delete/lists
    defaults:
        _controller: 'App\Media\Controller\PhotoGalleryController::galleryDeleteAction'
gallery_show:
    path: '/{id}/show'
    defaults:
        _controller: 'App\Media\Controller\PhotoGalleryController::showAction'
gallery_new:
    path: /new
    defaults:
        _controller: 'App\Media\Controller\PhotoGalleryController::newAction'
gallery_create:
    path: /create
    defaults:
        _controller: 'App\Media\Controller\PhotoGalleryController::createAction'
    requirements:
        _method: post
gallery_edit:
    path: '/{id}/edit'
    defaults:
        _controller: 'App\Media\Controller\PhotoGalleryController::editAction'
gallery_update:
    path: '/{id}/update'
    defaults:
        _controller: 'App\Media\Controller\PhotoGalleryController::updateAction'
    requirements:
        _method: post|put
gallery_delete:
    path: '/{id}/delete'
    defaults:
        _controller: 'App\Media\Controller\PhotoGalleryController::deleteAction'
gallery_status:
    path: '/{id}/status'
    defaults:
        _controller: 'App\Media\Controller\PhotoGalleryController::statusAction'
