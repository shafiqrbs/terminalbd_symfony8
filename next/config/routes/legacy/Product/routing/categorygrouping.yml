categorygrouping:
    path:     /
    defaults: { _controller: 'App\Product\Controller\CategoryGroupingController::indexAction' }

categorygrouping_show:
    path:     /{id}/show
    defaults: { _controller: 'App\Product\Controller\CategoryGroupingController::showAction' }

categorygrouping_new:
    path:     /new
    defaults: { _controller: 'App\Product\Controller\CategoryGroupingController::newAction' }

categorygrouping_create:
    path:     /create
    defaults: { _controller: 'App\Product\Controller\CategoryGroupingController::createAction' }
    requirements: { _method: post }

categorygrouping_edit:
    path:     /{id}/edit
    defaults: { _controller: 'App\Product\Controller\CategoryGroupingController::editAction' }

categorygrouping_update:
    path:     /{id}/update
    defaults: { _controller: 'App\Product\Controller\CategoryGroupingController::updateAction' }
    requirements: { _method: post|put }

categorygrouping_delete:
    path:     /{id}/delete
    defaults: { _controller: 'App\Product\Controller\CategoryGroupingController::deleteAction' }
    requirements: { _method: post|delete }
