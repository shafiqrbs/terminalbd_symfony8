homeslider:
    path:     /
    defaults: { _controller: 'App\Content\Controller\HomeSliderController::indexAction' }

homeslider_show:
    path:     /{id}/show
    defaults: { _controller: 'App\Content\Controller\HomeSliderController::showAction' }

homeslider_new:
    path:     /new
    defaults: { _controller: 'App\Content\Controller\HomeSliderController::newAction' }

homeslider_create:
    path:     /create
    defaults: { _controller: 'App\Content\Controller\HomeSliderController::createAction' }
    methods:  POST

homeslider_edit:
    path:     /{id}/edit
    defaults: { _controller: 'App\Content\Controller\HomeSliderController::editAction' }

homeslider_modify:
    path:     /modify
    defaults: { _controller: 'App\Content\Controller\HomeSliderController::modifyAction' }

homeslider_update:
    path:     /{id}/update
    defaults: { _controller: 'App\Content\Controller\HomeSliderController::updateAction' }
    methods:  [POST, PUT]

homeslider_delete:
    path:     /{id}/delete
    defaults: { _controller: 'App\Content\Controller\HomeSliderController::deleteAction' }

homeslider_status:
    path:     /{id}/status
    defaults: { _controller: 'App\Content\Controller\HomeSliderController::statusAction' }

homeslider_sorting:
    path:     /sorting
    defaults: { _controller: 'App\Content\Controller\HomeSliderController::sortingAction' }

homeslider_sorted:
    path:     /sorted
    defaults: { _controller: 'App\Content\Controller\HomeSliderController::sortedAction' }
