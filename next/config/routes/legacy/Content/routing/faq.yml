faq:
    path:     /
    defaults: { _controller: 'App\Content\Controller\FaqController::indexAction' }

faq_show:
    path:     /{id}/show
    defaults: { _controller: 'App\Content\Controller\FaqController::showAction' }

faq_new:
    path:     /new
    defaults: { _controller: 'App\Content\Controller\FaqController::newAction' }

faq_create:
    path:     /create
    defaults: { _controller: 'App\Content\Controller\FaqController::createAction' }
    methods:  POST

faq_edit:
    path:     /{id}/edit
    defaults: { _controller: 'App\Content\Controller\FaqController::editAction' }

faq_update:
    path:     /{id}/update
    defaults: { _controller: 'App\Content\Controller\FaqController::updateAction' }
    methods:  [POST, PUT]

faq_delete:
    path:     /{id}/delete
    defaults: { _controller: 'App\Content\Controller\FaqController::deleteAction' }

faq_status:
    path:     /{id}/status
    defaults: { _controller: 'App\Content\Controller\FaqController::statusAction' }

