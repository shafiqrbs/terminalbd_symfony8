homepage_edit:
    path:     /{id}/edit
    defaults: { _controller: 'App\Content\Controller\HomePageController::editAction' }

homepage_modify:
    path:     /modify
    defaults: { _controller: 'App\Content\Controller\HomePageController::modifyAction' }

homepage_update:
    path:     /{id}/update
    defaults: { _controller: 'App\Content\Controller\HomePageController::updateAction' }
    requirements: { _method: post|put }

homepage_delete:
    path:     /{id}/delete
    defaults: { _controller: 'App\Content\Controller\HomePageController::deleteAction' }

