blackout:
    path:     /
    defaults: { _controller: 'App\Content\Controller\BlackoutController::indexAction' }

blackout_show:
    path:     /{id}/show
    defaults: { _controller: 'App\Content\Controller\BlackoutController::showAction' }

blackout_new:
    path:     /new
    defaults: { _controller: 'App\Content\Controller\BlackoutController::newAction' }

blackout_create:
    path:     /create
    defaults: { _controller: 'App\Content\Controller\BlackoutController::createAction' }
    requirements: { _method: post }

blackout_edit:
    path:     /{id}/edit
    defaults: { _controller: 'App\Content\Controller\BlackoutController::editAction' }

blackout_update:
    path:     /{id}/update
    defaults: { _controller: 'App\Content\Controller\BlackoutController::updateAction' }
    requirements: { _method: post|put }

blackout_delete:
    path:     /{id}/delete
    defaults: { _controller: 'App\Content\Controller\BlackoutController::deleteAction' }
    requirements: { _method: post|delete }
