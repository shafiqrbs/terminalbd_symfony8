team:
    path:     /
    defaults: { _controller: 'App\Content\Controller\TeamController::indexAction' }

team_show:
    path:     /{id}/show
    defaults: { _controller: 'App\Content\Controller\TeamController::showAction' }

team_new:
    path:     /new
    defaults: { _controller: 'App\Content\Controller\TeamController::newAction' }

team_create:
    path:     /create
    defaults: { _controller: 'App\Content\Controller\TeamController::createAction' }
    requirements: { _method: post }

team_edit:
    path:     /{id}/edit
    defaults: { _controller: 'App\Content\Controller\TeamController::editAction' }

team_update:
    path:     /{id}/update
    defaults: { _controller: 'App\Content\Controller\TeamController::updateAction' }
    requirements: { _method: post|put }

team_delete:
    path:     /{id}/delete
    defaults: { _controller: 'App\Content\Controller\TeamController::deleteAction' }

team_status:
    path:     /{id}/status
    defaults: { _controller: 'App\Content\Controller\TeamController::statusAction' }

