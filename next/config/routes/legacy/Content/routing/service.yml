service:
    path:     /
    defaults: { _controller: 'App\Content\Controller\ServiceController::indexAction' }

service_show:
    path:     /{id}/show
    defaults: { _controller: 'App\Content\Controller\ServiceController::showAction' }

service_new:
    path:     /new
    defaults: { _controller: 'App\Content\Controller\ServiceController::newAction' }

service_create:
    path:     /create
    defaults: { _controller: 'App\Content\Controller\ServiceController::createAction' }
    methods:  POST

service_edit:
    path:     /{id}/edit
    defaults: { _controller: 'App\Content\Controller\ServiceController::editAction' }

service_status:
    path:     /{id}/status
    defaults: { _controller: 'App\Content\Controller\ServiceController::statusAction' }

service_update:
    path:     /{id}/update
    defaults: { _controller: 'App\Content\Controller\ServiceController::updateAction' }
    methods:  [POST, PUT]

service_delete:
    path:     /{id}/delete
    defaults: { _controller: 'App\Content\Controller\ServiceController::deleteAction' }

