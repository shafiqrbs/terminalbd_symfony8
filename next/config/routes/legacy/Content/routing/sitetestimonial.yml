# 1 route(s) repointed by check-routes.php: no such controller or action,
# so they answer 404 instead of a 500. See migration/contract/unresolvable-routes.md.
sitetestimonial:
    path: /
    defaults:
        _controller: 'App\Content\Controller\SiteTestimonialController::indexAction'
sitetestimonial_show:
    path: '/{id}/show'
    defaults:
        _controller: 'App\Content\Controller\SiteTestimonialController::showAction'
sitetestimonial_new:
    path: /new
    defaults:
        _controller: 'App\Content\Controller\SiteTestimonialController::newAction'
sitetestimonial_create:
    path: /create
    defaults:
        _controller: 'App\Content\Controller\SiteTestimonialController::createAction'
    methods: POST
sitetestimonial_edit:
    path: '/{id}/edit'
    defaults:
        _controller: 'App\Content\Controller\SiteTestimonialController::editAction'
sitetestimonial_status:
    path: '/{id}/status'
    defaults:
        missing: 'App\Content\Controller\SiteTestimonialController::statusAction'
    controller: App\Migration\Controller\UnresolvableRouteController
sitetestimonial_update:
    path: '/{id}/update'
    defaults:
        _controller: 'App\Content\Controller\SiteTestimonialController::updateAction'
    methods:
        - POST
        - PUT
sitetestimonial_delete:
    path: '/{id}/delete'
    defaults:
        _controller: 'App\Content\Controller\SiteTestimonialController::deleteAction'
