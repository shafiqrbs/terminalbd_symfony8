# 2 route(s) repointed by check-routes.php: no such controller or action,
# so they answer 404 instead of a 500. See migration/contract/unresolvable-routes.md.
newses:
    path: /listing
    defaults:
        missing: 'App\Content\Controller\NewsController::listingAction'
    controller: App\Migration\Controller\UnresolvableRouteController
newses_delete:
    path: listing/delete
    defaults:
        missing: 'App\Content\Controller\NewsController::listingDeleteAction'
    controller: App\Migration\Controller\UnresolvableRouteController
news:
    path: /
    defaults:
        _controller: 'App\Content\Controller\NewsController::indexAction'
news_show:
    path: '/{id}/show'
    defaults:
        _controller: 'App\Content\Controller\NewsController::showAction'
news_new:
    path: /new
    defaults:
        _controller: 'App\Content\Controller\NewsController::newAction'
news_create:
    path: /create
    defaults:
        _controller: 'App\Content\Controller\NewsController::createAction'
    requirements:
        _method: post
news_edit:
    path: '/{id}/edit'
    defaults:
        _controller: 'App\Content\Controller\NewsController::editAction'
news_update:
    path: '/{id}/update'
    defaults:
        _controller: 'App\Content\Controller\NewsController::updateAction'
    requirements:
        _method: post|put
news_delete:
    path: '/{id}/delete'
    defaults:
        _controller: 'App\Content\Controller\NewsController::deleteAction'
news_status:
    path: '/{id}/status'
    defaults:
        _controller: 'App\Content\Controller\NewsController::statusAction'
