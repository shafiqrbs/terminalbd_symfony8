timeline:
    path:     /
    defaults: { _controller: 'App\Content\Controller\TimelineController::indexAction' }

timeline_show:
    path:     /{id}/show
    defaults: { _controller: 'App\Content\Controller\TimelineController::showAction' }

timeline_new:
    path:     /new
    defaults: { _controller: 'App\Content\Controller\TimelineController::newAction' }

timeline_create:
    path:     /create
    defaults: { _controller: 'App\Content\Controller\TimelineController::createAction' }
    requirements: { _method: post }

timeline_edit:
    path:     /{id}/edit
    defaults: { _controller: 'App\Content\Controller\TimelineController::editAction' }

timeline_update:
    path:     /{id}/update
    defaults: { _controller: 'App\Content\Controller\TimelineController::updateAction' }
    requirements: { _method: post|put }

timeline_delete:
    path:     /{id}/delete
    defaults: { _controller: 'App\Content\Controller\TimelineController::deleteAction' }
    requirements: { _method: post|delete }
