# 4 route(s) repointed by check-routes.php: no such controller or action,
# so they answer 404 instead of a 500. See migration/contract/unresolvable-routes.md.
dps_treatment_accessories:
    path: /
    defaults:
        missing: App\DoctorPrescription\Controller\TreatmentAccessoriesController
    controller: App\Migration\Controller\UnresolvableRouteController
dps_treatment_accessories_create:
    path: /create
    defaults:
        missing: App\DoctorPrescription\Controller\TreatmentAccessoriesController
    methods: POST
    controller: App\Migration\Controller\UnresolvableRouteController
dps_treatment_accessories_delete:
    path: '/{id}/treatment-accessories-delete'
    defaults:
        missing: App\DoctorPrescription\Controller\TreatmentAccessoriesController
    controller: App\Migration\Controller\UnresolvableRouteController
dps_treatment_accessories_approved:
    path: '/{id}/treatment-accessories-approved'
    defaults:
        missing: App\DoctorPrescription\Controller\TreatmentAccessoriesController
    controller: App\Migration\Controller\UnresolvableRouteController
