dps_expensecategory:
    path:     /
    defaults: { _controller: 'App\DoctorPrescription\Controller\ExpenseCategoryController::indexAction' }

dps_expensecategory_show:
    path:     /{id}/show
    defaults: { _controller: 'App\DoctorPrescription\Controller\ExpenseCategoryController::showAction' }

dps_expensecategory_new:
    path:     /new
    defaults: { _controller: 'App\DoctorPrescription\Controller\ExpenseCategoryController::newAction' }

dps_expensecategory_create:
    path:     /create
    defaults: { _controller: 'App\DoctorPrescription\Controller\ExpenseCategoryController::createAction' }
    requirements: { _method: post }

dps_expensecategory_edit:
    path:     /{id}/edit
    defaults: { _controller: 'App\DoctorPrescription\Controller\ExpenseCategoryController::editAction' }

dps_expensecategory_sorting:
    path:     /sorting
    defaults: { _controller: 'App\DoctorPrescription\Controller\ExpenseCategoryController::sortingAction' }


dps_expensecategory_update:
    path:     /{id}/update
    defaults: { _controller: 'App\DoctorPrescription\Controller\ExpenseCategoryController::updateAction' }
    requirements: { _method: post|put }

dps_expensecategory_delete:
    path:     /{id}/delete
    defaults: { _controller: 'App\DoctorPrescription\Controller\ExpenseCategoryController::deleteAction' }
    requirements: { _method: post|delete }


