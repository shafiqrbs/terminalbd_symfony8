medicine_purchase_return:
    path:     /
    defaults: { _controller: 'App\Medicine\Controller\MedicinePurchaseReturnController::indexAction' }

medicine_purchase_return_new:
    path:     /new
    defaults: { _controller: 'App\Medicine\Controller\MedicinePurchaseReturnController::newAction' }

medicine_purchase_return_create:
    path:     /create
    defaults: { _controller: 'App\Medicine\Controller\MedicinePurchaseReturnController::createAction' }
    methods:  POST

medicine_purchase_return_edit:
    path:     /{id}/edit
    defaults: { _controller: 'App\Medicine\Controller\MedicinePurchaseReturnController::editAction' }

medicine_purchase_return_show:
    path:     /{id}/show
    defaults: { _controller: 'App\Medicine\Controller\MedicinePurchaseReturnController::showAction' }

medicine_purchase_return_update:
    path:     /{id}/update
    defaults: { _controller: 'App\Medicine\Controller\MedicinePurchaseReturnController::updateAction' }
    methods:  [POST]

medicine_purchase_return_delete:
    path:     /{id}/delete
    defaults: { _controller: 'App\Medicine\Controller\MedicinePurchaseReturnController::deleteAction' }

medicine_purchase_return_item_delete:
    path:     /{purchase}/{id}/item-delete
    defaults: { _controller: 'App\Medicine\Controller\MedicinePurchaseReturnController::deleteItemAction' }

medicine_purchase_return_approve:
    path:     /{id}/approve
    defaults: { _controller: 'App\Medicine\Controller\MedicinePurchaseReturnController::approveAction' }

medicine_purchase_return_discount_update:
    path:     /dicount-update
    defaults: { _controller: 'App\Medicine\Controller\MedicinePurchaseReturnController::invoiceDiscountUpdateAction' }
    methods:  POST
    options:
            expose: true