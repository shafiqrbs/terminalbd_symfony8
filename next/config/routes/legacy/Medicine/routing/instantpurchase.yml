medicine_instantpurchase:
    path:     /
    defaults: { _controller: 'App\Medicine\Controller\InstantPurchaseController::indexAction' }

medicine_instant_purchase_load:
    path:     /{sales}/medicine-instant-purchase-load
    defaults: { _controller: 'App\Medicine\Controller\InstantPurchaseController::instantPurchaseLoadAction' }
    options:
            expose: true

medicine_instant_purchase_add:
    path:     /medicine-instant-purchase-add
    defaults: { _controller: 'App\Medicine\Controller\InstantPurchaseController::instantPurchaseAddAction' }
    options:
            expose: true


medicine_instant_purchase_delete:
    path:     /{id}/medicine-instant-purchase-delete
    defaults: { _controller: 'App\Medicine\Controller\InstantPurchaseController::instantPurchaseDeleteAction' }

medicine_instantpurchase_particular_add:
    path:     /instant-purchase-particular-add
    defaults: { _controller: 'App\Medicine\Controller\InstantPurchaseController::addParticularAction' }
    methods:  POST
    options:
            expose: true

medicine_instantpurchase_item_add:
    path:     /instant-purchase-item-add
    defaults: { _controller: 'App\Medicine\Controller\InstantPurchaseController::addInstantPurchaseItemAction' }
    methods:  POST
    options:
            expose: true

