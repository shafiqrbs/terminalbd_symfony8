business_category:
    path:     /
    defaults: { _controller: 'App\Business\Controller\BusinessCategoryController::indexAction' }

business_category_create:
    path:     /create
    defaults: { _controller: 'App\Business\Controller\BusinessCategoryController::createAction' }
    methods:  POST

business_category_edit:
    path:     /{id}/edit
    defaults: { _controller: 'App\Business\Controller\BusinessCategoryController::editAction' }

business_category_update:
    path:     /{id}/update
    defaults: { _controller: 'App\Business\Controller\BusinessCategoryController::updateAction' }
    methods:  [POST, PUT]

business_category_delete:
    path:     /{id}/delete
    defaults: { _controller: 'App\Business\Controller\BusinessCategoryController::deleteAction' }

business_category_status:
    path:     /{id}/status
    defaults: { _controller: 'App\Business\Controller\BusinessCategoryController::statusAction' }

business_category_sorted:
    path:     /category-sorted
    defaults: { _controller: 'App\Business\Controller\BusinessCategoryController::sortedAction' }

