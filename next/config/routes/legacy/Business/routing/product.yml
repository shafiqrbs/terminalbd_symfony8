business_product:
    path:     /
    defaults: { _controller: 'App\Business\Controller\ProductController::indexAction' }

business_product_create:
    path:     /create
    defaults: { _controller: 'App\Business\Controller\ProductController::createAction' }
    methods:  POST

business_product_edit:
    path:     /{id}/edit
    defaults: { _controller: 'App\Business\Controller\ProductController::editAction' }

business_product_update:
    path:     /{id}/update
    defaults: { _controller: 'App\Business\Controller\ProductController::updateAction' }
    methods:  [POST, PUT]

business_product_delete:
    path:     /{id}/delete
    defaults: { _controller: 'App\Business\Controller\ProductController::deleteAction' }

business_product_status:
    path:     /{id}/status
    defaults: { _controller: 'App\Business\Controller\ProductController::statusAction' }

business_product_inline:
    path:     /inline-update
    defaults: { _controller: 'App\Business\Controller\ProductController::inlineUpdateAction' }