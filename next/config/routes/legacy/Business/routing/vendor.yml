business_vendor:
    path:     /
    defaults: { _controller: 'App\Business\Controller\VendorController::indexAction' }

business_vendor_search:
    path:     /search
    defaults: { _controller: 'App\Business\Controller\VendorController::autoSearchAction' }
    options:
            expose: true

business_vendor_name:
    path:      /{vendor}/vendor-name
    defaults: { _controller: 'App\Business\Controller\VendorController::searchVendorNameAction' }
    options:
            expose: true

business_vendor_create:
    path:     /create
    defaults: { _controller: 'App\Business\Controller\VendorController::createAction' }
    methods:  POST

business_vendor_edit:
    path:     /{id}/edit
    defaults: { _controller: 'App\Business\Controller\VendorController::editAction' }

business_vendor_update:
    path:     /{id}/update
    defaults: { _controller: 'App\Business\Controller\VendorController::updateAction' }
    methods:  [POST, PUT]

business_vendor_status:
    path:     /{id}/status
    defaults: { _controller: 'App\Business\Controller\VendorController::statusAction' }

business_vendor_delete:
    path:     /{id}/delete
    defaults: { _controller: 'App\Business\Controller\VendorController::deleteAction' }
