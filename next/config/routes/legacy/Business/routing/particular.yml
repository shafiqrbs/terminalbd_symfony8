business_particular:
    path:     /
    defaults: { _controller: 'App\Business\Controller\ParticularController::indexAction' }

business_particular_create:
    path:     /create
    defaults: { _controller: 'App\Business\Controller\ParticularController::createAction' }
    methods:  POST

business_particular_edit:
    path:     /{id}/edit
    defaults: { _controller: 'App\Business\Controller\ParticularController::editAction' }

business_particular_update:
    path:     /{id}/update
    defaults: { _controller: 'App\Business\Controller\ParticularController::updateAction' }
    methods:  [POST, PUT]

business_particular_delete:
    path:     /{id}/delete
    defaults: { _controller: 'App\Business\Controller\ParticularController::deleteAction' }

business_particular_status:
    path:     /{id}/status
    defaults: { _controller: 'App\Business\Controller\ParticularController::statusAction' }