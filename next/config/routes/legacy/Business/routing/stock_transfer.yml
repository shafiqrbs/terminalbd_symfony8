business_stock_transfer:
    path:     /
    defaults: { _controller: 'App\Business\Controller\StockTransferController::indexAction' }

business_transfer_create:
    path:     /wearhouse-transfer-create
    defaults: { _controller: 'App\Business\Controller\StockTransferController::createAction' }
    methods:  [POST]

business_transfer_delete:
    path:     /{id}/particular-delete
    defaults: { _controller: 'App\Business\Controller\StockTransferController::deleteAction' }
    options:
            expose: true

business_transfer_approve:
    path:     /{id}/particular-approve
    defaults: { _controller: 'App\Business\Controller\StockTransferController::approvedAction' }
    options:
        expose: true

business_transfer_reverse:
    path:     /{id}/reverse
    defaults: { _controller: 'App\Business\Controller\StockTransferController::reverseAction' }
    options:
        expose: true

