business_stock_adjustment:
    path:     /
    defaults: { _controller: 'App\Business\Controller\StockAdjustmentController::indexAction' }

business_stock_adjustment_new:
    path:     /new
    defaults: { _controller: 'App\Business\Controller\StockAdjustmentController::newAction' }

business_stock_adjustment_create:
    path:     /create
    defaults: { _controller: 'App\Business\Controller\StockAdjustmentController::createAction' }
    methods:  POST

business_stock_adjustment_delete:
    path:     /{id}/delete
    defaults: { _controller: 'App\Business\Controller\StockAdjustmentController::deleteAction' }

business_stock_adjustment_approved:
    path:     /{id}/approved
    defaults: { _controller: 'App\Business\Controller\StockAdjustmentController::approvedAction' }