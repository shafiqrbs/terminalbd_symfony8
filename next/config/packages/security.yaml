# Firewalls and hashers. Role hierarchy and access control are generated into
# security_roles.yaml by migration/bin/port-security.php - edit the legacy
# app/config/security.yml and re-run that script, not the generated file.
security:
    password_hashers:
        # Existing hashes are salted sha512 written by Symfony 2 via FOSUserBundle.
        # `auto` hashes new passwords with a modern algorithm; `migrate_from`
        # verifies the legacy format and hands the rehash to UserProvider's
        # upgradePassword(), so a user is upgraded on their next login and
        # nobody is forced to reset a password.
        App\User\Entity\User:
            algorithm: auto
            migrate_from: [legacy_sha512]

        # sha512 / base64 / 5000 iterations are Symfony 2's defaults for the
        # `sha512` encoder shorthand used in app/config/security.yml, and match
        # Symfony 8's MessageDigestPasswordHasher defaults exactly.
        legacy_sha512:
            algorithm: message_digest
            hash_algorithm: sha512
            encode_as_base64: true
            iterations: 5000

    providers:
        app_users:
            id: App\Security\UserProvider

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            pattern: ^/
            provider: app_users
            lazy: true
            form_login:
                login_path: login
                check_path: login
                enable_csrf: true
                default_target_path: landing_page
                always_use_default_target_path: true
            logout:
                path: logout
                target: login
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 31536000
                path: /home

when@test:
    security:
        password_hashers:
            # Keep tests fast, but do not weaken the legacy hasher - the whole
            # point of the migration tests is to exercise the real algorithm.
            App\User\Entity\User:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
                migrate_from: [legacy_sha512]
