mobilebankaccount:
    path:     /
    defaults: { _controller: 'App\Tool\Controller\PortalMobileBankAccountController::indexAction' }

mobilebankaccount_show:
    path:     /{id}/show
    defaults: { _controller: 'App\Tool\Controller\PortalMobileBankAccountController::showAction' }

mobilebankaccount_new:
    path:     /new
    defaults: { _controller: 'App\Tool\Controller\PortalMobileBankAccountController::newAction' }

mobilebankaccount_create:
    path:     /create
    defaults: { _controller: 'App\Tool\Controller\PortalMobileBankAccountController::createAction' }
    methods:  POST

mobilebankaccount_edit:
    path:     /{id}/edit
    defaults: { _controller: 'App\Tool\Controller\PortalMobileBankAccountController::editAction' }

mobilebankaccount_status:
    path:     /{id}/status
    defaults: { _controller: 'App\Tool\Controller\PortalMobileBankAccountController::statusAction' }


mobilebankaccount_update:
    path:     /{id}/update
    defaults: { _controller: 'App\Tool\Controller\PortalMobileBankAccountController::updateAction' }
    methods:  [POST, PUT]

mobilebankaccount_delete:
    path:     /{id}/delete
    defaults: { _controller: 'App\Tool\Controller\PortalMobileBankAccountController::deleteAction' }
