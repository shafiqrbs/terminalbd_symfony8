# 2 route(s) repointed by check-routes.php: no such controller or action,
# so they answer 404 instead of a 500. See migration/contract/unresolvable-routes.md.
transactionmethod:
    path: /
    defaults:
        missing: 'App\Tool\Controller\TransactionMethodController::indexAction'
    controller: App\Migration\Controller\UnresolvableRouteController
transactionmethod_show:
    path: '/{id}/show'
    defaults:
        missing: 'App\Tool\Controller\TransactionMethodController::showAction'
    controller: App\Migration\Controller\UnresolvableRouteController
transactionmethod_new:
    path: /new
    defaults:
        _controller: 'App\Tool\Controller\TransactionMethodController::newAction'
transactionmethod_create:
    path: /create
    defaults:
        _controller: 'App\Tool\Controller\TransactionMethodController::createAction'
    methods: POST
transactionmethod_edit:
    path: '/{id}/edit'
    defaults:
        _controller: 'App\Tool\Controller\TransactionMethodController::editAction'
transactionmethod_status:
    path: '/{id}/status'
    defaults:
        _controller: 'App\Tool\Controller\TransactionMethodController::statusAction'
transactionmethod_update:
    path: '/{id}/update'
    defaults:
        _controller: 'App\Tool\Controller\TransactionMethodController::updateAction'
    methods:
        - POST
        - PUT
transactionmethod_delete:
    path: '/{id}/delete'
    defaults:
        _controller: 'App\Tool\Controller\TransactionMethodController::deleteAction'
    methods:
        - POST
        - DELETE
