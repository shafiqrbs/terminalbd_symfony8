webtheme:
    path:     /
    defaults: { _controller: 'App\Tool\Controller\WebThemeController::indexAction' }

webtheme_show:
    path:     /{id}/show
    defaults: { _controller: 'App\Tool\Controller\WebThemeController::showAction' }

webtheme_new:
    path:     /new
    defaults: { _controller: 'App\Tool\Controller\WebThemeController::newAction' }

webtheme_create:
    path:     /create
    defaults: { _controller: 'App\Tool\Controller\WebThemeController::createAction' }
    requirements: { _method: post }

webtheme_edit:
    path:     /{id}/edit
    defaults: { _controller: 'App\Tool\Controller\WebThemeController::editAction' }

webtheme_update:
    path:     /{id}/update
    defaults: { _controller: 'App\Tool\Controller\WebThemeController::updateAction' }
    requirements: { _method: post|put }

webtheme_delete:
    path:     /{id}/delete
    defaults: { _controller: 'App\Tool\Controller\WebThemeController::deleteAction' }
    requirements: { _method: post|delete }

webtheme_status:
    path:     /{id}/status
    defaults: { _controller: 'App\Tool\Controller\WebThemeController::statusAction' }


