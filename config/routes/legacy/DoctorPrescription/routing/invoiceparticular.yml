hms_invoice_particular:
    path:     /
    defaults: { _controller: 'App\Hospital\Controller\InvoiceParticularController::indexAction' }

hms_invoice_particular_show:
    path:     /{id}/show
    defaults: { _controller: 'App\Hospital\Controller\InvoiceParticularController::showAction' }

hms_invoice_particular_preparation:
    path:     /{id}/preparation
    defaults: { _controller: 'App\Hospital\Controller\InvoiceParticularController::preparationAction' }

hms_invoice_particular_collection:
    path:     /{id}/sample-collection
    defaults: { _controller: 'App\Hospital\Controller\InvoiceParticularController::sampleCollectionAction' }

hms_invoice_particular_collection_confirm:
    path:     /{id}/sample-collection-confirm
    defaults: { _controller: 'App\Hospital\Controller\InvoiceParticularController::sampleCollectionConfirmAction' }

hms_invoice_particular_collection_barcode:
    path:     /{id}/sample-collection-barcode
    defaults: { _controller: 'App\Hospital\Controller\InvoiceParticularController::sampleCollectionBarcodeAction' }

hms_invoice_particular_update:
    path:     /{id}/update
    defaults: { _controller: 'App\Hospital\Controller\InvoiceParticularController::updateAction' }
    methods:  [POST, PUT]

hms_invoice_particular_delivery:
    path:     /{id}/delivery
    defaults: { _controller: 'App\Hospital\Controller\InvoiceParticularController::deliveryAction' }

hms_invoice_particular_report_print:
    path:     /{id}/pathological-report-print
    defaults: { _controller: 'App\Hospital\Controller\InvoiceParticularController::pathologicalReportPrintAction' }


hms_invoice_pathological_report_delete:
    path:     /{id}/pathological-report-delete
    defaults: { _controller: 'App\Hospital\Controller\InvoiceParticularController::pathologicalReportDeleteAction' }




