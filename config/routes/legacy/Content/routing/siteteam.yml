# 1 route(s) repointed by check-routes.php: no such controller or action,
# so they answer 404 instead of a 500. See migration/contract/unresolvable-routes.md.
siteteam:
    path: /
    defaults:
        _controller: 'App\Content\Controller\SiteTeamController::indexAction'
siteteam_show:
    path: '/{id}/show'
    defaults:
        _controller: 'App\Content\Controller\SiteTeamController::showAction'
siteteam_new:
    path: /new
    defaults:
        _controller: 'App\Content\Controller\SiteTeamController::newAction'
siteteam_create:
    path: /create
    defaults:
        _controller: 'App\Content\Controller\SiteTeamController::createAction'
    methods: POST
siteteam_edit:
    path: '/{id}/edit'
    defaults:
        _controller: 'App\Content\Controller\SiteTeamController::editAction'
siteteam_status:
    path: '/{id}/status'
    defaults:
        missing: 'App\Content\Controller\SiteTeamController::statusAction'
    controller: App\Migration\Controller\UnresolvableRouteController
siteteam_update:
    path: '/{id}/update'
    defaults:
        _controller: 'App\Content\Controller\SiteTeamController::updateAction'
    methods:
        - POST
        - PUT
siteteam_delete:
    path: '/{id}/delete'
    defaults:
        _controller: 'App\Content\Controller\SiteTeamController::deleteAction'
