# 1 route(s) repointed by check-routes.php: no such controller or action,
# so they answer 404 instead of a 500. See migration/contract/unresolvable-routes.md.
homeslider:
    path: /
    defaults:
        _controller: 'App\Content\Controller\HomeSliderController::indexAction'
homeslider_show:
    path: '/{id}/show'
    defaults:
        _controller: 'App\Content\Controller\HomeSliderController::showAction'
homeslider_new:
    path: /new
    defaults:
        _controller: 'App\Content\Controller\HomeSliderController::newAction'
homeslider_create:
    path: /create
    defaults:
        _controller: 'App\Content\Controller\HomeSliderController::createAction'
    methods: POST
homeslider_edit:
    path: '/{id}/edit'
    defaults:
        _controller: 'App\Content\Controller\HomeSliderController::editAction'
homeslider_modify:
    path: /modify
    defaults:
        missing: 'App\Content\Controller\HomeSliderController::modifyAction'
    controller: App\Migration\Controller\UnresolvableRouteController
homeslider_update:
    path: '/{id}/update'
    defaults:
        _controller: 'App\Content\Controller\HomeSliderController::updateAction'
    methods:
        - POST
        - PUT
homeslider_delete:
    path: '/{id}/delete'
    defaults:
        _controller: 'App\Content\Controller\HomeSliderController::deleteAction'
homeslider_status:
    path: '/{id}/status'
    defaults:
        _controller: 'App\Content\Controller\HomeSliderController::statusAction'
homeslider_sorting:
    path: /sorting
    defaults:
        _controller: 'App\Content\Controller\HomeSliderController::sortingAction'
homeslider_sorted:
    path: /sorted
    defaults:
        _controller: 'App\Content\Controller\HomeSliderController::sortedAction'
