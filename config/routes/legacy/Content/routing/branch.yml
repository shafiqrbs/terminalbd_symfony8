# 1 route(s) repointed by check-routes.php: no such controller or action,
# so they answer 404 instead of a 500. See migration/contract/unresolvable-routes.md.
branch:
    path: /
    defaults:
        _controller: 'App\Content\Controller\BranchController::indexAction'
branch_show:
    path: '/{id}/show'
    defaults:
        _controller: 'App\Content\Controller\BranchController::showAction'
branch_new:
    path: /new
    defaults:
        _controller: 'App\Content\Controller\BranchController::newAction'
branch_create:
    path: /create
    defaults:
        _controller: 'App\Content\Controller\BranchController::createAction'
    requirements:
        _method: post
branch_edit:
    path: '/{id}/edit'
    defaults:
        _controller: 'App\Content\Controller\BranchController::editAction'
branch_update:
    path: '/{id}/update'
    defaults:
        _controller: 'App\Content\Controller\BranchController::updateAction'
    requirements:
        _method: post|put
branch_delete:
    path: '/{id}/delete'
    defaults:
        _controller: 'App\Content\Controller\BranchController::deleteAction'
branch_status:
    path: '/{id}/status'
    defaults:
        _controller: 'App\Content\Controller\BranchController::statusAction'
branch_print_list:
    path: /print-list
    defaults:
        missing: 'SettingContentBundle::printList'
    controller: App\Migration\Controller\UnresolvableRouteController
