blog:
    path:     /
    defaults: { _controller: 'App\Content\Controller\BlogController::indexAction' }

blog_show:
    path:     /{id}/show
    defaults: { _controller: 'App\Content\Controller\BlogController::showAction' }

blog_new:
    path:     /new
    defaults: { _controller: 'App\Content\Controller\BlogController::newAction' }

blog_create:
    path:     /create
    defaults: { _controller: 'App\Content\Controller\BlogController::createAction' }
    requirements: { _method: post }

blog_edit:
    path:     /{id}/edit
    defaults: { _controller: 'App\Content\Controller\BlogController::editAction' }

blog_update:
    path:     /{id}/update
    defaults: { _controller: 'App\Content\Controller\BlogController::updateAction' }
    requirements: { _method: post|put }

blog_delete:
    path:     /{id}/delete
    defaults: { _controller: 'App\Content\Controller\BlogController::deleteAction' }


blog_status:
    path:     /{id}/status
    defaults: { _controller: 'App\Content\Controller\BlogController::statusAction' }

