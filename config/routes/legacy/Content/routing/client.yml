client:
    path:     /
    defaults: { _controller: 'App\Content\Controller\ClientController::indexAction' }

client_show:
    path:     /{id}/show
    defaults: { _controller: 'App\Content\Controller\ClientController::showAction' }

client_new:
    path:     /new
    defaults: { _controller: 'App\Content\Controller\ClientController::newAction' }

client_create:
    path:     /create
    defaults: { _controller: 'App\Content\Controller\ClientController::createAction' }
    methods:  POST

client_edit:
    path:     /{id}/edit
    defaults: { _controller: 'App\Content\Controller\ClientController::editAction' }


client_status:
    path:     /{id}/status
    defaults: { _controller: 'App\Content\Controller\ClientController::statusAction' }

client_update:
    path:     /{id}/update
    defaults: { _controller: 'App\Content\Controller\ClientController::updateAction' }
    methods:  [POST, PUT]

client_delete:
    path:     /{id}/delete
    defaults: { _controller: 'App\Content\Controller\ClientController::deleteAction' }

