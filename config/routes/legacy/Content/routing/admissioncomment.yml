admissioncomment:
    path:     /
    defaults: { _controller: 'App\Content\Controller\AdmissionCommentController::indexAction' }

admissioncomment_show:
    path:     /{id}/show
    defaults: { _controller: 'App\Content\Controller\AdmissionCommentController::showAction' }

admissioncomment_new:
    path:     /new
    defaults: { _controller: 'App\Content\Controller\AdmissionCommentController::newAction' }

admissioncomment_create:
    path:     /create
    defaults: { _controller: 'App\Content\Controller\AdmissionCommentController::createAction' }
    requirements: { _method: post }

admissioncomment_edit:
    path:     /{id}/edit
    defaults: { _controller: 'App\Content\Controller\AdmissionCommentController::editAction' }

admissioncomment_update:
    path:     /{id}/update
    defaults: { _controller: 'App\Content\Controller\AdmissionCommentController::updateAction' }
    requirements: { _method: post|put }

admissioncomment_delete:
    path:     /{id}/delete
    defaults: { _controller: 'App\Content\Controller\AdmissionCommentController::deleteAction' }
    requirements: { _method: post|delete }
