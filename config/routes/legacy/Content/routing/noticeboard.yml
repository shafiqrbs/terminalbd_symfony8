noticeboard:
    path:     /
    defaults: { _controller: 'App\Content\Controller\NoticeBoardController::indexAction' }

noticeboard_show:
    path:     /{id}/show
    defaults: { _controller: 'App\Content\Controller\NoticeBoardController::showAction' }

noticeboard_new:
    path:     /new
    defaults: { _controller: 'App\Content\Controller\NoticeBoardController::newAction' }

noticeboard_create:
    path:     /create
    defaults: { _controller: 'App\Content\Controller\NoticeBoardController::createAction' }
    requirements: { _method: post }

noticeboard_edit:
    path:     /{id}/edit
    defaults: { _controller: 'App\Content\Controller\NoticeBoardController::editAction' }

noticeboard_status:
    path:     /{id}/status
    defaults: { _controller: 'App\Content\Controller\NoticeBoardController::statusAction' }

noticeboard_update:
    path:     /{id}/update
    defaults: { _controller: 'App\Content\Controller\NoticeBoardController::updateAction' }
    requirements: { _method: post|put }

noticeboard_delete:
    path:     /{id}/delete
    defaults: { _controller: 'App\Content\Controller\NoticeBoardController::deleteAction' }
