mail:
    path:     /
    defaults: { _controller: 'App\Content\Controller\EmailBoxController::indexAction' }

mail_show:
    path:     /{id}/show
    defaults: { _controller: 'App\Content\Controller\EmailBoxController::showAction' }

mail_new:
    path:     /new
    defaults: { _controller: 'App\Content\Controller\EmailBoxController::newAction' }

mail_create:
    path:     /create
    defaults: { _controller: 'App\Content\Controller\EmailBoxController::createAction' }
    methods:  POST

mail_edit:
    path:     /{id}/edit
    defaults: { _controller: 'App\Content\Controller\EmailBoxController::editAction' }

mail_update:
    path:     /{id}/update
    defaults: { _controller: 'App\Content\Controller\EmailBoxController::updateAction' }
    methods:  [POST, PUT]

mail_delete:
    path:     /{id}/delete
    defaults: { _controller: 'App\Content\Controller\EmailBoxController::deleteAction' }
    methods:  [POST, DELETE]
