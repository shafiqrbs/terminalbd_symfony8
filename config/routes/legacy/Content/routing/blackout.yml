# 2 route(s) repointed by check-routes.php: no such controller or action,
# so they answer 404 instead of a 500. See migration/contract/unresolvable-routes.md.
blackout:
    path: /
    defaults:
        _controller: 'App\Content\Controller\BlackoutController::indexAction'
blackout_show:
    path: '/{id}/show'
    defaults:
        missing: 'App\Content\Controller\BlackoutController::showAction'
    controller: App\Migration\Controller\UnresolvableRouteController
blackout_new:
    path: /new
    defaults:
        _controller: 'App\Content\Controller\BlackoutController::newAction'
blackout_create:
    path: /create
    defaults:
        _controller: 'App\Content\Controller\BlackoutController::createAction'
    requirements:
        _method: post
blackout_edit:
    path: '/{id}/edit'
    defaults:
        _controller: 'App\Content\Controller\BlackoutController::editAction'
blackout_update:
    path: '/{id}/update'
    defaults:
        _controller: 'App\Content\Controller\BlackoutController::updateAction'
    requirements:
        _method: post|put
blackout_delete:
    path: '/{id}/delete'
    defaults:
        missing: 'App\Content\Controller\BlackoutController::deleteAction'
    requirements:
        _method: post|delete
    controller: App\Migration\Controller\UnresolvableRouteController
