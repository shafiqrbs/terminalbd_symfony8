mallshop:
    path:     /
    defaults: { _controller: 'App\Content\Controller\MallShopController::indexAction' }

mallshop_show:
    path:     /{id}/show
    defaults: { _controller: 'App\Content\Controller\MallShopController::showAction' }

mallshop_new:
    path:     /new
    defaults: { _controller: 'App\Content\Controller\MallShopController::newAction' }

mallshop_create:
    path:     /create
    defaults: { _controller: 'App\Content\Controller\MallShopController::createAction' }
    methods:  POST

mallshop_edit:
    path:     /{id}/edit
    defaults: { _controller: 'App\Content\Controller\MallShopController::editAction' }

mallshop_status:
    path:     /{id}/status
    defaults: { _controller: 'App\Content\Controller\MallShopController::statusAction' }

mallshop_update:
    path:     /{id}/update
    defaults: { _controller: 'App\Content\Controller\MallShopController::updateAction' }
    methods:  [POST, PUT]

mallshop_delete:
    path:     /{id}/delete
    defaults: { _controller: 'App\Content\Controller\MallShopController::deleteAction' }
