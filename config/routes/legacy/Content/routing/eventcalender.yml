eventcalender:
    path:     /
    defaults: { _controller: 'App\Content\Controller\EventCalenderController::indexAction' }

eventcalender_show:
    path:     /{id}/show
    defaults: { _controller: 'App\Content\Controller\EventCalenderController::showAction' }

eventcalender_new:
    path:     /new
    defaults: { _controller: 'App\Content\Controller\EventCalenderController::newAction' }

eventcalender_create:
    path:     /create
    defaults: { _controller: 'App\Content\Controller\EventCalenderController::createAction' }
    requirements: { _method: post }

eventcalender_edit:
    path:     /{id}/edit
    defaults: { _controller: 'App\Content\Controller\EventCalenderController::editAction' }

eventcalender_update:
    path:     /{id}/update
    defaults: { _controller: 'App\Content\Controller\EventCalenderController::updateAction' }
    requirements: { _method: post|put }

eventcalender_delete:
    path:     /{id}/delete
    defaults: { _controller: 'App\Content\Controller\EventCalenderController::deleteAction' }
    requirements: { _method: post|delete }
