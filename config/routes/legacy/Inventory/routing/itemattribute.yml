itemattribute:
    path:     /
    defaults: { _controller: 'App\Inventory\Controller\ItemAttributeController::indexAction' }

itemattribute_show:
    path:     /{id}/show
    defaults: { _controller: 'App\Inventory\Controller\ItemAttributeController::showAction' }

itemattribute_new:
    path:     /new
    defaults: { _controller: 'App\Inventory\Controller\ItemAttributeController::newAction' }

itemattribute_create:
    path:     /create
    defaults: { _controller: 'App\Inventory\Controller\ItemAttributeController::createAction' }
    methods:  POST

itemattribute_edit:
    path:     /{id}/edit
    defaults: { _controller: 'App\Inventory\Controller\ItemAttributeController::editAction' }

itemattribute_status:
    path:     /{id}/status
    defaults: { _controller: 'App\Inventory\Controller\ItemAttributeController::statusAction' }

itemattribute_update:
    path:     /{id}/update
    defaults: { _controller: 'App\Inventory\Controller\ItemAttributeController::updateAction' }
    methods:  [POST, PUT]

itemattribute_delete:
    path:     /{id}/delete
    defaults: { _controller: 'App\Inventory\Controller\ItemAttributeController::deleteAction' }
    methods:  [POST, DELETE]
