# 2 route(s) repointed by check-routes.php: no such controller or action,
# so they answer 404 instead of a 500. See migration/contract/unresolvable-routes.md.
accountmobilebank:
    path: /
    defaults:
        _controller: 'App\Accounting\Controller\AccountMobileBankController::indexAction'
accountmobilebank_show:
    path: '/{id}/show'
    defaults:
        _controller: 'App\Accounting\Controller\AccountMobileBankController::showAction'
accountmobilebank_new:
    path: /new
    defaults:
        _controller: 'App\Accounting\Controller\AccountMobileBankController::newAction'
accountmobilebank_create:
    path: /create
    defaults:
        _controller: 'App\Accounting\Controller\AccountMobileBankController::createAction'
    methods: POST
accountmobilebank_edit:
    path: '/{id}/edit'
    defaults:
        _controller: 'App\Accounting\Controller\AccountMobileBankController::editAction'
accountmobilebank_update:
    path: '/{id}/update'
    defaults:
        _controller: 'App\Accounting\Controller\AccountMobileBankController::updateAction'
    methods:
        - POST
        - PUT
accountmobilebank_approve:
    path: '/{id}/payment-approve'
    defaults:
        missing: 'App\Accounting\Controller\AccountMobileBankController::approveAction'
    options:
        expose: true
    controller: App\Migration\Controller\UnresolvableRouteController
accountmobilebank_inline:
    path: /inline-update
    defaults:
        missing: 'App\Accounting\Controller\AccountMobileBankController::inlineUpdateAction'
    controller: App\Migration\Controller\UnresolvableRouteController
accountmobilebank_delete:
    path: '/{id}/delete'
    defaults:
        _controller: 'App\Accounting\Controller\AccountMobileBankController::deleteAction'
    options:
        expose: true
