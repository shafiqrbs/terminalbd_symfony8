journal_voucher:
    path:     /
    defaults: { _controller: 'App\Accounting\Controller\JournalVoucherController::indexAction' }

journal_voucher_item:
    path:     /entry-item
    defaults: { _controller: 'App\Accounting\Controller\JournalVoucherController::journalDetailsAction' }

journal_voucher_show:
    path:     /{id}/show
    defaults: { _controller: 'App\Accounting\Controller\JournalVoucherController::showAction' }

journal_voucher_new:
    path:     /new
    defaults: { _controller: 'App\Accounting\Controller\JournalVoucherController::newAction' }

journal_voucher_create:
    path:     /create
    defaults: { _controller: 'App\Accounting\Controller\JournalVoucherController::createAction' }
    methods:  POST

journal_voucher_edit:
    path:     /{id}/edit
    defaults: { _controller: 'App\Accounting\Controller\JournalVoucherController::editAction' }

journal_voucher_update:
    path:     /{id}/update
    defaults: { _controller: 'App\Accounting\Controller\JournalVoucherController::updateAction' }

journal_voucher_approve:
    path:     /{id}/payment-approve
    defaults: { _controller: 'App\Accounting\Controller\JournalVoucherController::approveAction' }
    options:
           expose: true

journal_voucher_inline:
    path:     /inline-update
    defaults: { _controller: 'App\Accounting\Controller\JournalVoucherController::inlineUpdateAction' }


journal_voucher_delete:
    path:     /{id}/delete
    defaults: { _controller: 'App\Accounting\Controller\JournalVoucherController::deleteAction' }
    options:
           expose: true

journal_voucher_approve_delete:
    path:     /{id}/approve-delete
    defaults: { _controller: 'App\Accounting\Controller\JournalVoucherController::approveDeleteAction' }
    options:
           expose: true

journal_voucher_item_delete:
    path:     /{id}/entry-item-delete
    defaults: { _controller: 'App\Accounting\Controller\JournalVoucherController::itemDeleteAction' }
    options:
           expose: true

journal_voucher_pdf:
    path:     /report-pdf
    defaults: { _controller: 'App\Accounting\Controller\JournalVoucherController::journalPdfAction' }

journal_voucher_approve_reset:
    path:     /approve-journal-reset
    defaults: { _controller: 'App\Accounting\Controller\JournalVoucherController::approveJournalResetAction' }

journal_voucher_print:
    path:     /{id}/print
    defaults: { _controller: 'App\Accounting\Controller\JournalVoucherController::printAction' }