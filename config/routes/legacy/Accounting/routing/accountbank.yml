# 2 route(s) repointed by check-routes.php: no such controller or action,
# so they answer 404 instead of a 500. See migration/contract/unresolvable-routes.md.
accountbank:
    path: /
    defaults:
        _controller: 'App\Accounting\Controller\AccountBankController::indexAction'
accountbank_show:
    path: '/{id}/show'
    defaults:
        _controller: 'App\Accounting\Controller\AccountBankController::showAction'
accountbank_new:
    path: /new
    defaults:
        _controller: 'App\Accounting\Controller\AccountBankController::newAction'
accountbank_create:
    path: /create
    defaults:
        _controller: 'App\Accounting\Controller\AccountBankController::createAction'
    methods: POST
accountbank_edit:
    path: '/{id}/edit'
    defaults:
        _controller: 'App\Accounting\Controller\AccountBankController::editAction'
accountbank_update:
    path: '/{id}/update'
    defaults:
        _controller: 'App\Accounting\Controller\AccountBankController::updateAction'
    methods:
        - POST
        - PUT
accountbank_approve:
    path: '/{id}/payment-approve'
    defaults:
        missing: 'App\Accounting\Controller\AccountBankController::approveAction'
    options:
        expose: true
    controller: App\Migration\Controller\UnresolvableRouteController
accountbank_inline:
    path: /inline-update
    defaults:
        missing: 'App\Accounting\Controller\AccountBankController::inlineUpdateAction'
    controller: App\Migration\Controller\UnresolvableRouteController
accountbank_delete:
    path: '/{id}/delete'
    defaults:
        _controller: 'App\Accounting\Controller\AccountBankController::deleteAction'
    options:
        expose: true
