account_balancetransfer:
    path:     /
    defaults: { _controller: 'App\Accounting\Controller\AccountBalanceTransferController::indexAction' }

account_balancetransfer_new:
    path:     /new
    defaults: { _controller: 'App\Accounting\Controller\AccountBalanceTransferController::newAction' }

account_balancetransfer_create:
    path:     /create
    defaults: { _controller: 'App\Accounting\Controller\AccountBalanceTransferController::createAction' }
    methods:  POST

account_balancetransfer_reverse:
    path:     /{id}/reverse
    defaults: { _controller: 'App\Accounting\Controller\AccountBalanceTransferController::journalReverseAction' }

account_balancetransfer_approve:
    path:     /{id}/payment-approve
    defaults: { _controller: 'App\Accounting\Controller\AccountBalanceTransferController::approveAction' }
    options:
           expose: true

account_balancetransfer_inline:
    path:     /inline-update
    defaults: { _controller: 'App\Accounting\Controller\AccountBalanceTransferController::inlineUpdateAction' }


account_balancetransfer_delete:
    path:     /{id}/delete
    defaults: { _controller: 'App\Accounting\Controller\AccountBalanceTransferController::deleteAction' }
    options:
           expose: true

account_balancetransfer_approve_delete:
    path:     /{id}/approve-delete
    defaults: { _controller: 'App\Accounting\Controller\AccountBalanceTransferController::approveDeleteAction' }
    options:
           expose: true
