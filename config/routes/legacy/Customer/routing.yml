customer_domain_product:
    resource: 'routing/product.yml'
    prefix:   /{shop}/product


customer_domain:
    resource: 'routing/domain.yml'
    prefix:   /{shop}

customer_order_process:
    resource: 'routing/order.yml'
    prefix:   /{shop}/order

customer_order_wishlist:
    resource: 'routing/wishlist.yml'
