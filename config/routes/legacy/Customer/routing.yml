customer_pre_order_process:
    resource: 'routing/preorder.yml'
    prefix:   /{shop}/pre-order

agent_client:
    resource: 'routing/agentclient.yml'
    prefix:   /agent

customer_website:
    resource: 'routing/customerweb.yml'
