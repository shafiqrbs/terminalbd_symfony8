appearancewebsitewidget:
    path:     /
    defaults: { _controller: 'App\Appearance\Controller\WebsiteWidgetController::indexAction' }

appearancewebsitewidget_sorting:
    path:     /sorting
    defaults: { _controller: 'App\Appearance\Controller\WebsiteWidgetController::sortingAction' }

appearancewebsitewidget_list_sorted:
    path:     /sorted-list
    defaults: { _controller: 'App\Appearance\Controller\WebsiteWidgetController::sortedListAction' }

appearancewebsitewidget_show:
    path:     /{id}/show
    defaults: { _controller: 'App\Appearance\Controller\WebsiteWidgetController::showAction' }

appearancewebsitewidget_new:
    path:     /new
    defaults: { _controller: 'App\Appearance\Controller\WebsiteWidgetController::newAction' }

appearancewebsitewidget_create:
    path:     /create
    defaults: { _controller: 'App\Appearance\Controller\WebsiteWidgetController::createAction' }
