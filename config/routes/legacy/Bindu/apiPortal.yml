# 1 route(s) repointed by check-routes.php: no such controller or action,
# so they answer 404 instead of a 500. See migration/contract/unresolvable-routes.md.
api_portal_contact:
    path: /information
    defaults:
        _controller: 'App\Bindu\Controller\ApiPortalController::portalInformationAction'
api_portal_domain_list:
    path: /domain-list
    defaults:
        _controller: 'App\Bindu\Controller\ApiPortalController::domainListAction'
api_portal_app:
    path: /apps
    defaults:
        _controller: 'App\Bindu\Controller\ApiPortalController::appsAction'
api_portal_app_details:
    path: /app-details
    defaults:
        _controller: 'App\Bindu\Controller\ApiPortalController::appDetailsAction'
api_portal_app_customer:
    path: /app-customer
    defaults:
        _controller: 'App\Bindu\Controller\ApiPortalController::appWiseCustomerAction'
api_portal_app_user_register:
    path: /app-user-register
    defaults:
        missing: 'App\Bindu\Controller\ApiPortalController::userRegisterAction'
    methods: POST
    options:
        expose: true
    controller: App\Migration\Controller\UnresolvableRouteController
