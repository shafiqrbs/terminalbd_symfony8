# 2 route(s) repointed by check-routes.php: no such controller or action,
# so they answer 404 instead of a 500. See migration/contract/unresolvable-routes.md.
hms_accessories_purchase:
    path: /
    defaults:
        _controller: 'App\Hospital\Controller\AccessoriesPurchaseController::indexAction'
hms_accessories_purchase_show:
    path: '/{id}/show'
    defaults:
        _controller: 'App\Hospital\Controller\AccessoriesPurchaseController::showAction'
hms_accessories_purchase_new:
    path: /new
    defaults:
        _controller: 'App\Hospital\Controller\AccessoriesPurchaseController::newAction'
hms_accessories_purchase_edit:
    path: '/{id}/edit'
    defaults:
        _controller: 'App\Hospital\Controller\AccessoriesPurchaseController::editAction'
hms_accessories_purchase_update:
    path: '/{id}/update'
    defaults:
        _controller: 'App\Hospital\Controller\AccessoriesPurchaseController::updateAction'
    methods:
        - POST
        - PUT
hms_accessories_purchase_status:
    path: '/{id}/status'
    defaults:
        _controller: 'App\Hospital\Controller\AccessoriesPurchaseController::editAction'
hms_accessories_purchase_approve:
    path: '/{id}/approve'
    defaults:
        missing: 'App\Hospital\Controller\AccessoriesPurchaseController::approveAction'
    controller: App\Migration\Controller\UnresolvableRouteController
hms_accessories_purchase_delete:
    path: '/{id}/delete'
    defaults:
        _controller: 'App\Hospital\Controller\AccessoriesPurchaseController::deleteAction'
hms_accessories_purchase_particular_search:
    path: '/{id}/particular-search'
    defaults:
        _controller: 'App\Hospital\Controller\AccessoriesPurchaseController::particularSearchAction'
hms_accessories_purchase_particular_add:
    path: '/{invoice}/particular-add'
    defaults:
        _controller: 'App\Hospital\Controller\AccessoriesPurchaseController::addParticularAction'
    methods: POST
    options:
        expose: true
hms_accessories_purchase_discount_update:
    path: /purchase/dicount-update
    defaults:
        _controller: 'App\Hospital\Controller\AccessoriesPurchaseController::invoiceDiscountUpdateAction'
    methods: POST
    options:
        expose: true
hms_accessories_purchase_approved:
    path: '/{id}/invoice-approved'
    defaults:
        _controller: 'App\Hospital\Controller\AccessoriesPurchaseController::approvedAction'
hms_accessories_purchase_particular_delete:
    path: '/{invoice}/{id}/particular-delete'
    defaults:
        _controller: 'App\Hospital\Controller\AccessoriesPurchaseController::invoiceParticularDeleteAction'
hms_accessories_purchase_print_invoice:
    path: '/{id}/print'
    defaults:
        missing: 'App\Hospital\Controller\AccessoriesPurchaseController::invoicePrintAction'
    controller: App\Migration\Controller\UnresolvableRouteController
