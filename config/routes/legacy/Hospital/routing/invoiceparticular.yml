        missing: 'App\Hospital\Controller\InvoiceParticularController::groupPathologyTestAction'
    controller: App\Migration\Controller\UnresolvableRouteController
hms_invoice_group_pathology_approve:
    path: '/{id}/group-pathology-approve'
