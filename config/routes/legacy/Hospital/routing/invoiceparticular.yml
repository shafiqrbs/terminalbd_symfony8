    defaults:
        _controller: 'App\Hospital\Controller\InvoiceParticularController::groupPathologicalReportAction'
hms_pathological_group_report_update:
    path: '/{invoice}/group-update'
    defaults:
        _controller: 'App\Hospital\Controller\InvoiceParticularController::groupUpdateAction'
