        _controller: 'App\Hospital\Controller\InvoiceParticularController::deliveryGroupAction'
hms_invoice_group_pathology_print:
    path: '/{id}/group-pathology-print'
    defaults:
        _controller: 'App\Hospital\Controller\InvoiceParticularController::groupReportPrintAction'
hms_invoice_report_process:
    path: /collection-process
    defaults:
        _controller: 'App\Hospital\Controller\InvoiceParticularController::reportProcessAction'
hms_pathological_group_report:
