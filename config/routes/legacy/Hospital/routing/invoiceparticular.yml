# 1 route(s) repointed by check-routes.php: no such controller or action,
# so they answer 404 instead of a 500. See migration/contract/unresolvable-routes.md.
hms_invoice_particular:
    path: /
    defaults:
        _controller: 'App\Hospital\Controller\InvoiceParticularController::indexAction'
hms_invoice_patient_test:
    path: /patient-test
    defaults:
        _controller: 'App\Hospital\Controller\InvoiceParticularController::patientTestAction'
hms_invoice_patient_group_test:
