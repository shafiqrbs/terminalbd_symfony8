hms_labuser:
    path:     /
    defaults: { _controller: 'App\Hospital\Controller\LabUserController::indexAction' }

hms_labuser_show:
    path:     /{id}/show
    defaults: { _controller: 'App\Hospital\Controller\LabUserController::showAction' }

hms_labuser_generate:
    path:     /generate
    defaults: { _controller: 'App\Hospital\Controller\LabUserController::generateLabUserAction' }

hms_labuser_new:
    path:     /new
    defaults: { _controller: 'App\Hospital\Controller\LabUserController::newAction' }

hms_labuser_create:
    path:     /create
    defaults: { _controller: 'App\Hospital\Controller\LabUserController::createAction' }
    methods:  POST

hms_labuser_edit:
    path:     /{id}/edit
    defaults: { _controller: 'App\Hospital\Controller\LabUserController::editAction' }

hms_labuser_update:
    path:     /{id}/update
    defaults: { _controller: 'App\Hospital\Controller\LabUserController::updateAction' }
    methods:  [POST, PUT]

hms_labuser_delete:
    path:     /{id}/delete
    defaults: { _controller: 'App\Hospital\Controller\LabUserController::deleteAction' }

hms_labuser_status:
    path:     /{id}/status
    defaults: { _controller: 'App\Hospital\Controller\LabUserController::statusAction' }