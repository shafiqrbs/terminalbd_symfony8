hms_pathological_report:
    path:    /{pathology}
    defaults: { _controller: 'App\Hospital\Controller\PathologicalReportController::pathologicalReportAction' }

hms_pathological_report_create:
    path:      /{pathology}/create
    defaults: { _controller: 'App\Hospital\Controller\PathologicalReportController::createAction' }
    methods:  POST

hms_pathological_report_edit:
    path:      /{pathology}/{id}/edit
    defaults: { _controller: 'App\Hospital\Controller\PathologicalReportController::editAction' }

hms_pathological_report_update:
    path:      /{pathology}/{id}/update
    defaults: { _controller: 'App\Hospital\Controller\PathologicalReportController::updateAction' }
    methods:  [POST, PUT]

hms_pathological_report_delete:
    path:      /{pathology}/{id}/delete
    defaults: { _controller: 'App\Hospital\Controller\PathologicalReportController::deleteAction' }

hms_pathological_report_status:
    path:      /{pathology}/{id}/status
    defaults: { _controller: 'App\Hospital\Controller\PathologicalReportController::statusAction' }

hms_pathological_report_list_sorted:
    path:      /sorted/{pathology}
    defaults: { _controller: 'App\Hospital\Controller\PathologicalReportController::sortingAction' }
    methods:  POST

hms_pathological_report_inline_update:
    path:     /{pathology}/report-inline-update
    defaults: { _controller: 'App\Hospital\Controller\PathologicalReportController::inlineReportUpdateAction' }
