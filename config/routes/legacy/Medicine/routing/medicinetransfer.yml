medicine_transfer:
    path:     /
    defaults: { _controller: 'App\Medicine\Controller\MedicineTransferController::indexAction' }

medicine_transfer_new:
    path:     /new
    defaults: { _controller: 'App\Medicine\Controller\MedicineTransferController::newAction' }

medicine_transfer_create:
    path:     /create
    defaults: { _controller: 'App\Medicine\Controller\MedicineTransferController::createAction' }
    methods:  POST

medicine_transfer_edit:
    path:     /{id}/edit
    defaults: { _controller: 'App\Medicine\Controller\MedicineTransferController::editAction' }

medicine_transfer_show:
    path:     /{id}/show
    defaults: { _controller: 'App\Medicine\Controller\MedicineTransferController::showAction' }

medicine_transfer_update:
    path:     /{id}/update
    defaults: { _controller: 'App\Medicine\Controller\MedicineTransferController::updateAction' }
    methods:  [POST]

medicine_transfer_delete:
    path:     /{id}/delete
    defaults: { _controller: 'App\Medicine\Controller\MedicineTransferController::deleteAction' }

medicine_transfer_item_delete:
    path:     /{purchase}/{id}/item-delete
    defaults: { _controller: 'App\Medicine\Controller\MedicineTransferController::deleteItemAction' }

medicine_transfer_approve:
    path:     /{id}/approve
    defaults: { _controller: 'App\Medicine\Controller\MedicineTransferController::approveAction' }

medicine_transfer_discount_update:
    path:     /dicount-update
    defaults: { _controller: 'App\Medicine\Controller\MedicineTransferController::invoiceDiscountUpdateAction' }
    methods:  POST
    options:
            expose: true