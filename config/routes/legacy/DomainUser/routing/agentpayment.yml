agentpayment:
    path:     /
    defaults: { _controller: 'App\DomainUser\Controller\AgentPaymentController::indexAction' }

agentpayment_show:
    path:     /{id}/show
    defaults: { _controller: 'App\DomainUser\Controller\AgentPaymentController::showAction' }

agentpayment_invoice:
    path:     /invoice
    defaults: { _controller: 'App\DomainUser\Controller\AgentPaymentController::newAction' }

agentpayment_create:
    path:     /create
    defaults: { _controller: 'App\DomainUser\Controller\AgentPaymentController::createAction' }
    methods:  POST

agentpayment_edit:
    path:     /{id}/edit
    defaults: { _controller: 'App\DomainUser\Controller\AgentPaymentController::editAction' }

agentpayment_update:
    path:     /{id}/update
    defaults: { _controller: 'App\DomainUser\Controller\AgentPaymentController::updateAction' }
    methods:  [POST, PUT]

agentpayment_delete:
    path:     /{id}/delete
    defaults: { _controller: 'App\DomainUser\Controller\AgentPaymentController::deleteAction' }
    methods:  [POST, DELETE]
