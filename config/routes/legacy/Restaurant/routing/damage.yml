restaurant_damage:
    path:     /
    defaults: { _controller: 'App\Restaurant\Controller\DamageController::indexAction' }

restaurant_damage_new:
    path:     /new
    defaults: { _controller: 'App\Restaurant\Controller\DamageController::newAction' }

restaurant_damage_create:
    path:     /create
    defaults: { _controller: 'App\Restaurant\Controller\DamageController::createAction' }
    methods:  POST

restaurant_damage_edit:
    path:     /{id}/edit
    defaults: { _controller: 'App\Restaurant\Controller\DamageController::editAction' }

restaurant_damage_update:
    path:     /{id}/update
    defaults: { _controller: 'App\Restaurant\Controller\DamageController::updateAction' }
    methods:  [POST, PUT]

restaurant_damage_delete:
    path:     /{id}/delete
    defaults: { _controller: 'App\Restaurant\Controller\DamageController::deleteAction' }

restaurant_damage_approve:
    path:     /{id}/approved
    defaults: { _controller: 'App\Restaurant\Controller\DamageController::approvedAction' }


