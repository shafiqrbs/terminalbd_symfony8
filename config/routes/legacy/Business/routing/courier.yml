business_courier:
    path:     /
    defaults: { _controller: 'App\Business\Controller\CourierController::indexAction' }

business_courier_create:
    path:     /create
    defaults: { _controller: 'App\Business\Controller\CourierController::createAction' }
    methods:  POST

business_courier_edit:
    path:     /{id}/edit
    defaults: { _controller: 'App\Business\Controller\CourierController::editAction' }

business_courier_update:
    path:     /{id}/update
    defaults: { _controller: 'App\Business\Controller\CourierController::updateAction' }
    methods:  [POST, PUT]

business_courier_delete:
    path:     /{id}/delete
    defaults: { _controller: 'App\Business\Controller\CourierController::deleteAction' }

business_courier_status:
    path:     /{id}/status
    defaults: { _controller: 'App\Business\Controller\BusinessAreaController::statusAction' }

