business_production:
    path:     /
    defaults: { _controller: 'App\Business\Controller\ProductionController::indexAction' }

business_post_production:
    path:     /{id}/post
    defaults: { _controller: 'App\Business\Controller\ProductionController::postProductionAction' }

business_pre_production:
    path:     /{id}/pre
    defaults: { _controller: 'App\Business\Controller\ProductionController::preProductionAction' }

business_production_update:
    path:     /{id}/update
    defaults: { _controller: 'App\Business\Controller\ProductionController::productionUpdateAction' }
    methods:  [POST, PUT]

business_pre_production_create:
    path:     /{item}/pre-production-create
    defaults: { _controller: 'App\Business\Controller\ProductionController::preProductionCreateAction' }
    methods:  [POST]

business_pre_production_update:
    path:     /{id}/pre-production-update
    defaults: { _controller: 'App\Business\Controller\ProductionController::preProductionUpdateAction' }
    methods:  [POST, PUT]

business_pre_production_show:
    path:     /{id}/show
    defaults: { _controller: 'App\Business\Controller\ProductionController::showAction' }

business_pre_production_delete:
    path:     /{particular}/{id}/delete
    defaults: { _controller: 'App\Business\Controller\ProductionController::deleteAction' }

business_production_particular_search:
    path:     /{id}/particular-search
    defaults: { _controller: 'App\Business\Controller\ProductionController::particularSearchAction' }


business_production_particular_add:
    path:     /{id}/particular-add
    defaults: { _controller: 'App\Business\Controller\ProductionController::addParticularAction' }
    methods:  POST
    options:
            expose: true

business_production_approve:
    path:     /{id}/approve
    defaults: { _controller: 'App\Business\Controller\ProductionController::approvedAction' }
    options:
            expose: true

