business_fuelstation:
    path:     /
    defaults: { _controller: 'App\Business\Controller\InvoiceFuelPumpController::indexAction' }

business_fuelstation_new:
    path:     /new
    defaults: { _controller: 'App\Business\Controller\InvoiceFuelPumpController::newAction' }

business_fuelstation_edit:
    path:     /{id}/edit
    defaults: { _controller: 'App\Business\Controller\InvoiceFuelPumpController::editAction' }

business_fuelstation_add_particular:
    path:     /{id}/add-particular
    defaults: { _controller: 'App\Business\Controller\InvoiceFuelPumpController::addParticularAction' }
    methods:  POST
    options:
            expose: true

business_fuelstation_item_delete:
    path:     /{id}/item-delete
    defaults: { _controller: 'App\Business\Controller\InvoiceFuelPumpController::itemDeleteAction' }
    options:
            expose: true

business_fuelstation_item_approve:
    path:     /{id}/item-approve
    defaults: { _controller: 'App\Business\Controller\InvoiceFuelPumpController::itemApproveAction' }
    options:
            expose: true

business_fuelstation_delete:
    path:     /{id}/delete
    defaults: { _controller: 'App\Business\Controller\InvoiceFuelPumpController::deleteAction' }

business_fuelstation_show:
    path:     /{id}/show
    defaults: { _controller: 'App\Business\Controller\InvoiceFuelPumpController::showAction' }


business_fuelstation_item_update:
    path:     /{id}/item-batch-update
    defaults: { _controller: 'App\Business\Controller\InvoiceFuelPumpController::batchItemUpdateAction' }
