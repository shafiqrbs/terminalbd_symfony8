; Production PHP overrides for the terminalbd container.
; Loaded after php.ini-production as conf.d/zz-app.ini.

; CRITICAL: expose the container/Coolify environment to $_ENV. Under Apache
; mod_php the default variables_order omits "E", so public/index.php bootEnv()
; cannot read APP_ENV / DATABASE_URL. EGPCS fixes that.
variables_order = "EGPCS"

memory_limit = 512M
date.timezone = Asia/Dhaka
expose_php = Off

; Uploads / exports (phpspreadsheet, image uploads)
upload_max_filesize = 32M
post_max_size = 40M
max_execution_time = 120

; Sessions are stored in the DB via PdoSessionHandler (framework.yaml
; handler_id: session.handler.shared), so save_path is unused; it stays only as
; a harmless fallback. CRITICAL: php.ini-production turns session.use_strict_mode
; ON, which makes Symfony reject any session id it did not itself initialize —
; that breaks the shared session with the legacy app (SharedSessionAuthenticator
; reads the id the legacy PHP app created) and, on php:8.5, throws "Session id
; must be a string" in session_start(). The legacy app runs with strict mode
; off; this side must match.
session.save_path = "/var/www/html/var/sessions"
session.use_strict_mode = 0

; OPcache — immutable image, so timestamp validation is off for max throughput.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
realpath_cache_size = 4096K
realpath_cache_ttl = 600
