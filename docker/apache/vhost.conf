<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        # Honor the project's public/.htaccess (mod_rewrite -> index.php)
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
        # Fallback if mod_rewrite/.htaccess is ever unavailable
        FallbackResource /index.php
    </Directory>

    # Never serve dotfiles or config/source artifacts if they end up under docroot
    <FilesMatch "(^\.|\.(env|dist|lock|ya?ml|ini|twig|php_cs|md)$)">
        Require all denied
    </FilesMatch>
    # index.php is the front controller and must stay reachable
    <Files "index.php">
        Require all granted
    </Files>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
